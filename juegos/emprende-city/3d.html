<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tycoon City 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: mundo a pantalla completa en canvas; HUD en esquinas, controles en la zona de pulgares, menús como hoja inferior. */
:root {
  --ink: #0f1a2e;          /* panel noche */
  --ink-2: #1a2a45;
  --line: #2c4166;
  --paper: #f3efe4;        /* texto claro */
  --muted: #9fb0cb;
  --cash: #46d98a;         /* dinero */
  --gold: #ffb627;         /* acento */
  --danger: #ff6b5b;
  --chart: #3d8bfd;        /* línea de las gráficas de la bolsa (validada sobre el panel oscuro) */
  --display: "Bricolage Grotesque", "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
  --body: "Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: #22303f; color: var(--paper); overflow: hidden; }
body { font-family: var(--body); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none; }
#game, #overlay { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#overlay { pointer-events: none; }
.iconbtn.sm { width: 44px; height: 44px; border-radius: 14px; font-size: 18px; }
button { font-family: var(--body); color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* HUD */
.hud { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(10px + env(safe-area-inset-left, 0px)); display: grid; gap: 4px; pointer-events: none; max-width: calc(100vw - 150px); }
.money { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 6vw, 34px); line-height: 1; color: var(--cash); text-shadow: 0 2px 0 #0b1322, 0 0 12px rgba(0,0,0,.35); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.money.neg { color: var(--danger); }
.chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(15,26,46,.82); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; width: max-content; max-width: 100%; font-variant-numeric: tabular-nums; }
.goal { background: rgba(15,26,46,.88); border-color: rgba(255,182,39,.7); color: #ffe2a6; white-space: normal; border-radius: 12px; line-height: 1.25; }
.mission { border-color: rgba(70,217,138,.8); color: #d9ffe9; font-size: 14px; }
.mission.bad { border-color: var(--danger); color: #ffd9d4; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.04); } }
.goal b { color: var(--gold); text-transform: uppercase; font-size: 10.5px; letter-spacing: .08em; }

.topright { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); display: grid; gap: 8px; justify-items: end; }
#minimap { width: 112px; height: 112px; border-radius: 14px; border: 2px solid var(--line); background: #0f1a2e; display: block; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
.iconrow { display: flex; gap: 8px; }
.iconbtn { width: 52px; height: 52px; border-radius: 16px; border: 2px solid var(--line); background: rgba(15,26,46,.9); display: grid; place-items: center; font-size: 11px; font-weight: 700; gap: 0; padding: 4px 0; position: relative; }
.iconbtn svg { width: 22px; height: 22px; }
.iconbtn:active { transform: scale(.94); }
.badge { position: absolute; top: -6px; right: -6px; background: var(--danger); color: #fff; border-radius: 999px; font-size: 11px; min-width: 20px; height: 20px; display: grid; place-items: center; padding: 0 5px; }

.ticker { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px)); height: 26px; background: rgba(10,18,32,.86); border-top: 1px solid var(--line); overflow: hidden; pointer-events: none; display: flex; align-items: center; }
.ticker .tag { flex: none; background: var(--gold); color: #1b1300; font-weight: 800; font-size: 11px; letter-spacing: .08em; padding: 0 10px; height: 100%; display: grid; place-items: center; text-transform: uppercase; z-index: 1; padding-left: max(10px, env(safe-area-inset-left, 0px)); }
.ticker .track { white-space: nowrap; font-size: 13px; color: #d6deec; animation: tick 38s linear infinite; padding-left: 100%; }
@keyframes tick { to { transform: translateX(-100%); } }

/* Controles táctiles */
.actions { position: fixed; right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(40px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; justify-items: end; }
.act { min-width: 92px; height: 92px; border-radius: 50%; border: 3px solid rgba(255,255,255,.18); background: var(--gold); color: #1b1300; font-family: var(--display); font-weight: 800; font-size: 15px; line-height: 1.05; padding: 8px; box-shadow: 0 6px 0 #9c6a00, 0 10px 20px rgba(0,0,0,.35); display: grid; place-items: center; text-align: center; }
.act.serve { background: var(--cash); box-shadow: 0 6px 0 #1d8a50, 0 10px 20px rgba(0,0,0,.35); }
.act.alt { min-width: 0; width: auto; height: 46px; border-radius: 999px; font-size: 14px; padding: 0 16px; background: #e9e3d3; box-shadow: 0 4px 0 #9b9482; }
.act.dim { opacity: .55; }
.act:active { transform: translateY(4px); box-shadow: 0 2px 0 #9c6a00; }
.act .ico { font-size: 22px; display: block; }
#joy { position: fixed; width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); background: rgba(15,26,46,.25); pointer-events: none; transform: translate(-50%,-50%); }
#joy i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(243,239,228,.75); }
.hint-move { position: fixed; left: calc(20px + env(safe-area-inset-left, 0px)); bottom: calc(44px + env(safe-area-inset-bottom, 0px)); font-size: 13px; color: var(--paper); background: rgba(15,26,46,.75); border-radius: 12px; padding: 8px 12px; pointer-events: none; max-width: 46vw; }

/* Toasts y banners */
.toasts { position: fixed; top: calc(256px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: grid; gap: 6px; width: min(92vw, 420px); pointer-events: none; }
.toast { background: rgba(15,26,46,.94); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 12px; padding: 9px 12px; font-size: 14px; animation: tin .25s ease-out; box-shadow: 0 8px 20px rgba(0,0,0,.3); }
.toast.good { border-left-color: var(--cash); }
.toast.bad { border-left-color: var(--danger); }
@media (orientation: landscape) and (max-height: 560px) { .toasts { top: calc(10px + env(safe-area-inset-top, 0px)); width: min(42vw, 420px); } .toast { font-size: 13px; padding: 7px 10px; } }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }
.banner { position: fixed; top: 38%; left: 0; right: 0; text-align: center; pointer-events: none; font-family: var(--display); font-weight: 800; font-size: clamp(30px, 8vw, 52px); color: var(--paper); text-shadow: 0 3px 0 rgba(0,0,0,.45); opacity: 0; transition: opacity .5s; }
.banner small { display: block; font-family: var(--body); font-size: 13px; letter-spacing: .25em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.banner.on { opacity: 1; }
#sleepFx { position: fixed; inset: 0; background: #050a18; opacity: 0; transition: opacity .8s ease; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: clamp(40px, 12vw, 72px); color: #c9d6ff; }
#sleepFx.on { opacity: 1; }
#doorFx { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .28s ease-out; }
#doorFx.on { opacity: 1; transition: none; }
#sleepFx span { animation: zz 1.6s ease-in-out infinite; }
@keyframes zz { 50% { transform: translateY(-8px); opacity: .7; } }

/* Hoja de menús */
.scrim { position: fixed; inset: 0; background: rgba(5,10,20,.45); }
.sheet { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: min(100vw, 480px); max-height: 82dvh; background: var(--ink); border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,.45); animation: sup .22s ease-out; -webkit-user-select: text; user-select: text; touch-action: pan-y; }
@keyframes sup { from { transform: translate(-50%, 30px); opacity: .4; } }
.sheet header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.sheet header h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 22px; flex: 1; min-width: 0; text-wrap: balance; line-height: 1.1; }
.sheet header .em { font-size: 30px; }
.close { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--ink-2); font-size: 20px; flex: none; }
.sheet .body { grid-auto-rows: max-content; overflow-y: auto; padding: 12px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.tabs { display: flex; gap: 6px; padding: 10px 16px 0; overflow-x: auto; flex: none; }
.tab { border: 1px solid var(--line); background: var(--ink-2); border-radius: 999px; padding: 8px 13px; font-size: 14px; font-weight: 700; white-space: nowrap; min-height: 40px; }
.tab.on { background: var(--gold); color: #1b1300; border-color: var(--gold); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.stat { background: var(--ink-2); border-radius: 12px; padding: 8px 10px; }
.stat span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-weight: 700; }
.stat b { font-size: 17px; font-variant-numeric: tabular-nums; }
.btn { border: 0; border-radius: 12px; min-height: 46px; padding: 10px 14px; font-weight: 700; font-size: 15px; background: var(--ink-2); border: 1px solid var(--line); flex: 1 1 auto; }
.btn.primary { background: var(--gold); color: #1b1300; border-color: var(--gold); }
.btn.cash { background: var(--cash); color: #05250f; border-color: var(--cash); }
.btn.danger { background: transparent; color: var(--danger); border-color: rgba(255,107,91,.5); }
.btn:disabled { opacity: .4; cursor: default; }
.list { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; background: var(--ink-2); border: 1px solid transparent; border-radius: 14px; padding: 10px; text-align: left; width: 100%; }
.item .em { font-size: 28px; text-align: center; }
.item .t { font-weight: 700; font-size: 15px; }
.item .s { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.item .p { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.item.locked { opacity: .45; }
.item.done .t { text-decoration: line-through; color: var(--muted); }
.dots { color: var(--gold); letter-spacing: 1px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: var(--ink-2); min-height: 44px; font-weight: 700; font-size: 14px; }
.seg button.on { background: var(--gold); color: #1b1300; }
.note { font-size: 13px; color: var(--muted); line-height: 1.45; margin: 0; }
.lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; margin: 4px 0 -4px; }
.bar { height: 8px; background: #0b1322; border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--cash); }

/* Pantalla de título */
.title { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(120% 80% at 50% 0%, rgba(255,182,39,.25), transparent 60%), rgba(8,14,26,.72); padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.title .card { width: min(100%, 420px); display: grid; gap: 14px; text-align: center; }
.title h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(46px, 14vw, 76px); line-height: .9; letter-spacing: -.03em; color: var(--paper); text-shadow: 0 5px 0 #9c6a00; }
.title h1 span { color: var(--gold); display: block; }
.title p { margin: 0; color: #d6deec; line-height: 1.45; }
.title input { width: 100%; box-sizing: border-box; min-height: 50px; border-radius: 14px; border: 2px solid var(--line); background: var(--ink); color: var(--paper); font: 700 18px var(--body); padding: 0 14px; text-align: center; -webkit-user-select: text; user-select: text; }
.title .btn { min-height: 54px; font-size: 18px; }
.keys { font-size: 12.5px; color: var(--muted); }

/* Mapa grande */
.mapwrap { position: fixed; inset: 0; background: rgba(5,10,20,.88); display: grid; place-items: center; padding: 16px; }
.mapwrap canvas { max-width: 100%; max-height: 72dvh; border-radius: 16px; border: 2px solid var(--line); touch-action: none; }
.mapwrap .legend { display: flex; flex-wrap: wrap; gap: 10px 16px; justify-content: center; font-size: 13px; margin-top: 10px; color: #d6deec; }
.mapwrap .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.mapcol { display: grid; justify-items: center; gap: 4px; max-width: 100%; }
@media (prefers-reduced-motion: reduce) { .ticker .track { animation-duration: 90s; } .sheet, .toast { animation: none; } }
</style>
<style>
.hud{gap:7px}.money{letter-spacing:-.04em}.chip,.iconbtn,.hint-move{backdrop-filter:blur(14px)}
.title{background:radial-gradient(ellipse at 50% 20%,#ffb62728,transparent 60%),#080e1ac9;backdrop-filter:blur(5px);overflow-y:auto;box-sizing:border-box}
.title .card{padding:26px;border:1px solid #ffffff24;border-radius:28px;background:linear-gradient(145deg,#182940eb,#0b1424eb);box-sizing:border-box;box-shadow:0 30px 100px #0006}.title h1{font-size:clamp(42px,10vw,66px)}
.session-tools{display:flex;gap:6px}.session-tools button{min-width:44px;min-height:40px;border:1px solid var(--line);border-radius:12px;background:var(--ink);font-weight:700;padding:8px 12px}
#progressCard{background:#0f1a2ee8;border:1px solid #46d98a55;border-radius:12px;padding:6px 10px;width:min(220px,calc(100vw - 180px));font-size:11px;display:grid;gap:4px}#progressCard strong{display:block;margin:4px 0 8px;font-size:13px}#progressCard small{color:var(--cash)}.guide-step{padding:12px;border-radius:12px;background:var(--ink-2);line-height:1.5}
@media(max-height:620px){#progressCard{display:none}.hud{gap:3px}.title .card{gap:9px;padding:18px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}
/* Entrada de ERAGames: tapa la carga y se va sola (o al tocar) */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#1a2a45 0%,#0b1322 70%);transition:opacity .45s ease;cursor:pointer}
#splash.off{opacity:0;pointer-events:none}
#splash .sp{display:grid;justify-items:center;gap:12px;animation:spIn .7s cubic-bezier(.2,.8,.2,1) both}
#splash .sp-logo{font-family:var(--display);font-weight:800;font-size:clamp(52px,16vw,96px);line-height:1;letter-spacing:-.02em;color:#f3efe4}
#splash .sp-logo b{color:#f04e23}
#splash .sp-bar{height:4px;width:min(220px,56vw);border-radius:4px;background:#f04e23;transform-origin:left;animation:spBar .9s .25s cubic-bezier(.6,0,.2,1) both}
#splash small{font:600 13px var(--body,system-ui);letter-spacing:.32em;text-transform:uppercase;color:#9fb0cb;animation:spIn .6s .55s both}
@keyframes spIn{from{opacity:0;transform:translateY(10px) scale(.96)}}
@keyframes spBar{from{transform:scaleX(0)}}
</style>

<body>
<canvas id="game" aria-label="Ciudad"></canvas>
<canvas id="overlay" aria-hidden="true"></canvas>

<div class="hud" id="hud" hidden>
  <div class="money" id="money">$0</div>
  <div class="chip" id="clock"></div>
  <div class="chip" id="place"></div>
  <div class="chip goal" id="goal"></div>
  <div id="progressCard"><div class="bar"><i id="progressFill"></i></div><small id="progressCount"></small></div>
  <div class="chip mission" id="mission" hidden></div>
</div>

<div class="topright" id="topright" hidden>
  <div class="session-tools"><button id="btnGuide" aria-label="Guía">? Guía</button><button id="btnPause" aria-label="Pausar">Ⅱ</button></div>
  <canvas id="minimap" width="224" height="224" aria-label="Mapa"></canvas>
  <div class="iconrow">
    <button class="iconbtn" id="btnMap" aria-label="Mapa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg><span data-t="map"></span></button>
    <button class="iconbtn" id="btnPhone" aria-label="Teléfono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg><span data-t="phone"></span><b class="badge" id="phoneBadge" hidden>!</b></button>
  </div>
  <div class="iconrow">
    <button class="iconbtn sm" id="btnRotL" aria-label="Girar cámara a la izquierda">⟲</button>
    <button class="iconbtn sm" id="btnZoom" aria-label="Cambiar zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5M8 10.5h5M10.5 8v5"/></svg></button>
    <button class="iconbtn sm" id="btnRotR" aria-label="Girar cámara a la derecha">⟳</button>
  </div>
</div>

<div class="actions" id="actions" hidden>

</div>

<div id="splash" role="img" aria-label="ERAGames"><div class="sp"><div class="sp-logo"><b>ERA</b>GAMES</div><div class="sp-bar"></div><small id="splashSub">presenta</small></div></div>
<script>
// La entrada de ERAGames va aparte del juego: se quita aunque el motor 3D tarde o no cargue
(function () {
  var sp = document.getElementById('splash'), lang = 'es', skip = false;
  try { lang = localStorage.getItem('emprende-city:lang') || (/^es/i.test(navigator.language || 'es') ? 'es' : 'en'); skip = sessionStorage.getItem('emprende-city:skip-splash') === '1'; sessionStorage.removeItem('emprende-city:skip-splash'); } catch (e) { }
  document.getElementById('splashSub').textContent = lang === 'en' ? 'presents' : 'presenta';
  var gone = false, hide = function () { if (gone) return; gone = true; sp.classList.add('off'); setTimeout(function () { sp.remove(); }, 500); };
  if (skip) { sp.remove(); return; }              // al cambiar de idioma no se repite
  sp.addEventListener('pointerdown', hide);
  window.addEventListener('keydown', hide, { once: true });
  // Se queda mínimo 2.3 s y, cuando el juego terminó de armar la ciudad, 1.4 s más para que se vea completa
  var t0 = Date.now(), min = matchMedia('(prefers-reduced-motion: reduce)').matches ? 1200 : 2300;
  window.addEventListener('era-ready', function () { setTimeout(hide, Math.max(1400, min - (Date.now() - t0))); }, { once: true });
  setTimeout(hide, 8000);                         // por si el juego no avisa (sin motor 3D, error)
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
if (!window.THREE) document.getElementById('ui').innerHTML = '<div class="title"><div class="card"><h1>Tycoon<span>City 3D</span></h1><p>' + (/^en/i.test(localStorage.getItem('emprende-city:lang') || (/^es/i.test(navigator.language) ? 'es' : 'en')) ? "Couldn't load the 3D engine. Check your internet connection and open the game again." : 'No se pudo cargar el motor 3D. Revisa tu conexión a internet y vuelve a abrir el juego.') + '</p></div></div>';
</script>
<script>
'use strict';
/* =====================================================================
   TYCOON CITY 3D (antes Emprende City) — juego de emprendimiento en mundo abierto (ERAGames)
   Módulos: datos · i18n · mundo · simulación · vida (NPC, autos, clima)
            · render · entrada · interfaz · guardado
   ===================================================================== */

// ---------- Idioma (español / inglés) ----------
// Se elige en el título o en Ajustes; cambiarlo guarda y recarga, porque los letreros 3D se dibujan al cargar.
const LANG_KEY = 'emprende-city:lang';
const LANG = (() => { try { const v = localStorage.getItem(LANG_KEY); if (v === 'es' || v === 'en') return v; } catch (e) { } return /^es/i.test(navigator.language || 'es') ? 'es' : 'en'; })();
const L = (es, en) => LANG === 'en' ? en : es;   // texto suelto en los dos idiomas
const CDN_ENGINE = true;   // itch/build.py lo cambia a false: ahí el motor 3D va dentro del zip

// La ciudad original (6×6 manzanas) se generó primero; los barrios nuevos se agregan al oeste (OX columnas) y al sur

function curve(p, h) {
  let v = 0;
  for (const [c, w, a] of PROF[p]) { let d = Math.abs(h - c); d = Math.min(d, 24 - d); v += a * Math.exp(-((d / w) ** 2)); }
  return Math.min(1, v);
}
function curveSum(p) { let s = 0; for (let i = 0; i < 96; i++) s += curve(p, i / 4); return s / 4; }

// Economía derivada: los negocios baratos recuperan la inversión más rápido; los caros escalan en volumen.
for (const t of TYPES) {
  t.wage = Math.round(20 + Math.sqrt(t.cost) * 0.55);
  t.upkeep = Math.round(t.cost * 0.004) + 3;
  const roi = Math.max(0.3, 1.9 - 0.12 * Math.log(t.cost));
  const gross = t.cost * roi + t.wage * t.staff + t.upkeep;
  t.demand = gross / (t.ticket * curveSum(t.prof));       // clientes/hora en el pico, nivel 1
  t.perStaff = t.demand * 1.15 / t.staff;                // capacidad por empleado
}

let S = null;

const lotOf = b => lots[b.lot];
const bizAtLot = id => S.biz.find(b => b.lot === id);
function bizName(b) { return S.brand + ' ' + nm(b.type); }
function rivalName(l) { return nm(l.rival.type) + ' ' + l.rival.owner; }
function invested(b) { const ty = TYPE[b.type]; let v = b.paid; for (let L = 1; L < b.level; L++) v += upgradeCost(ty, L); return v; }
function netWorth() { let v = S.money - S.loan + (S && S.mkt ? portfolioValue() : 0); for (const b of S.biz) v += invested(b) * 0.6; for (let i = 1; i <= ((S && S.homeLv) || 0); i++) v += HOMES[i].cost * 0.6; return v; }
function priceOf(type, district) { return Math.round(TYPE[type].cost * LAND[district]); }
function buyoutPrice(l) { return Math.round(priceOf(l.rival.type, l.district) * (1.25 + 0.25 * l.rival.level)); }

function maxStaff(b) { const ty = TYPE[b.type]; return Math.max(ty.staff + b.level - 1, Math.round(ty.staff * (1 + 0.35 * (b.level - 1)))); }
function mgrWage(b) { return Math.max(60, TYPE[b.type].wage * 3); }

const DJ_MULT = [1, 1.3, 1.65], DJ_NAMES = L(['Sin DJ', 'DJ local', 'DJ famoso'], ['No DJ', 'Local DJ', 'Famous DJ']);
function djCost(b) { return [0, TYPE[b.type].wage * 4, TYPE[b.type].wage * 12][b.dj || 0]; }
function dailyCost(b) { const ty = TYPE[b.type]; return b.staff * ty.wage + (b.manager ? mgrWage(b) : 0) + ty.upkeep * b.level + djCost(b); }
const hour = () => (S.min % 1440) / 60;
const weekday = () => (S.day - 1) % 7;

// Competencia: misma categoría a menos de 10 tiles
const compCache = new Map();
function recomputeCompetition() {
  compCache.clear();
  const all = [];
  for (const b of S.biz) all.push({ lot: b.lot, type: b.type });
  for (const l of lots) if (l.kind === 'rival' && !bizAtLot(l.id)) all.push({ lot: l.id, type: l.rival.type });
  for (const a of all) {
    const la = lots[a.lot]; let m = 1, n = 0;
    for (const o of all) if (o !== a && o.type === a.type) {
      const lo = lots[o.lot];
      if (Math.abs(lo.x - la.x) + Math.abs(lo.y - la.y) < 10 * T) { m *= 0.72; n++; }
    }
    compCache.set(a.lot, { m: Math.max(0.35, m), n });
  }
}
function fitDots(f) { const n = f < .8 ? 1 : f < 1 ? 2 : f < 1.2 ? 3 : f < 1.45 ? 4 : 5; return '●'.repeat(n) + '○'.repeat(5 - n); }

// Demanda actual (clientes por hora de juego)
function weatherMult(ty) {
  const w = S.weather;
  if (w === 'rain') return ty.tags.includes('rainy') ? 1.3 : (ty.tags.includes('outdoor') || ty.tags.includes('heat')) ? 0.5 : 0.85;
  if (w === 'cloud') return ty.tags.includes('heat') ? 0.8 : 1;
  return 1;
}
function demandOf(b, presentBonus) {
  const ty = TYPE[b.type], l = lotOf(b), ev = EVENTS.find(e => e.id === S.event);
  let d = ty.demand * curve(ty.prof, hour()) * ty.fit[l.district];
  d *= 1 + 0.35 * (b.level - 1);
  d *= 0.6 + b.rep / 125;
  d *= [1.25, 1, 0.75][b.price];
  d *= (compCache.get(b.lot) || { m: 1 }).m;
  d *= weatherMult(ty);
  d *= ev ? ev.mult(b, l) : 1;
  if (weekday() >= 5) d *= ty.tags.includes('leisure') ? 1.25 : 0.95;
  if (ty.tags.includes('volatile')) d *= S.startupF;
  if (b.dj) d *= DJ_MULT[b.dj];
  if (S.buff && S.min < S.buff.until) d *= S.buff.mult;   // descansaste bien en casa
  if (presentBonus) d *= 1.5;   // el dueño atendiendo atrae clientes
  return d;
}
function capacityOf(b) { return b.staff * TYPE[b.type].perStaff; }

// =====================================================================
const QUEUE_MAX = 7, PATIENCE = 14;
function playerNearDoor(l, r = 90) { return (inside && inside.l === l) || dist2(P.x, P.y, l.door.x, l.door.y) < r * r; }
function simEconomy(dtMin, dtReal) {
  for (const b of S.biz) {
    const l = lotOf(b), present = playerNearDoor(l);
    const dem = demandOf(b, present);
    b.arr += dem / 60 * dtMin;
    const cap = capacityOf(b);
    b.tok = Math.min(Math.max(1, b.staff), b.tok + cap / 60 * dtMin);
    while (b.arr >= 1) {
      b.arr -= 1;
      const full = !b.manager && b.cash >= regCap(b);
      if (full) { b.lostFull++; continue; }
      if (b.tok >= 1) { b.tok -= 1; sale(b, false); }
      else if (present && b.queue.length < QUEUE_MAX) b.queue.push({ p: PATIENCE, c: pick(SHIRTS), s: pick(SKINS) });
      else b.missed++;
    }
    // Fila: el personal también atiende; la paciencia se agota con el tiempo real
    for (let i = b.queue.length - 1; i >= 0; i--) {
      const q = b.queue[i];
      if (b.tok >= 1) { b.tok -= 1; b.queue.splice(i, 1); sale(b, false); continue; }
      q.p -= dtReal;
      if (q.p <= 0) { b.queue.splice(i, 1); b.rep = Math.max(0, b.rep - 1.2); if (present) floatText(l.door.x, l.door.y - 30, '😤', '#ff6b5b'); }
    }
    if (!present && b.queue.length && b.staff === 0) b.queue.length = 0;
    // La reputación tiende a la calidad del negocio
    const target = clamp(34 + b.level * 9 + [8, 0, -12][b.price] + (b.manager ? 5 : 0) + (b.staff >= maxStaff(b) ? 6 : 0), 5, 98);
    b.rep += (target - b.rep) * 0.002 * dtMin;
    if (b.manager && b.cash > 0) { const c = b.cash; b.cash = 0; S.money += c; S.stats.collected += c; }
  }
}
function sale(b, byPlayer) {
  const ty = TYPE[b.type];
  const amt = ty.ticket * [0.8, 1, 1.3][b.price] * (byPlayer ? 1.2 : 1) * (0.85 + rnd() * 0.3);
  if (byPlayer) { S.money += amt; S.stats.collected += amt; } else b.cash += amt;
  b.todayRev += amt; b.todaySales++; S.stats.earned += amt;
  b.rep = Math.min(100, b.rep + 0.04);
  onSaleVisual(b, amt, byPlayer);
}
function serveOne(b) {
  if (!b.queue.length) return false;
  const q = b.queue.shift(); sale(b, true); S.stats.served++;
  if (inside && inside.id === b.lot) interiorWalker(true, { c: q.c, s: q.s, h: '#2b1d14', p: '#2b2d42' });
  sfx('serve'); vibrate(8);
  return true;
}
function collect(b) {
  if (b.cash < 1) return;
  const l = lotOf(b), c = b.cash;
  S.money += c; S.stats.collected += c; b.cash = 0;
  floatText(l.door.x, l.door.y - 40, '+' + fmt(c), '#46d98a', 1.4);
  for (let i = 0; i < Math.min(14, 4 + c / 50); i++) spawnParticle('coin', l.door.x, l.door.y - 10);
  sfx('coin'); vibrate(15);
}
function endOfDay() {
  let wages = 0, rev = 0;
  for (const b of S.biz) {
    const c = dailyCost(b); wages += c; rev += b.todayRev;
    b.yRev = b.todayRev; b.yProfit = b.todayRev - c; b.todayRev = 0; b.todaySales = 0; b.missed = 0; b.lostFull = 0;
  }
  const interest = Math.round(S.loan * 0.015);

  const dv = S.mkt ? payDividends() : 0;
  if (dv >= 1) toast(L(`💵 Dividendos de tus acciones: +${fmt(dv)}`, `💵 Stock dividends: +${fmt(dv)}`), 'good', 5000);
  S.startupF = 0.25 + rnd() * 1.9;
  if (S.biz.length) toast(`${t('dailyReport')} ${S.day}: ${t('profit')} ${fmt(rev - wages - interest)} · ${t('wages')} ${fmt(wages)}${interest ? ' · ' + t('interest') + ' ' + fmt(interest) : ''}`, rev - wages - interest >= 0 ? 'good' : 'bad', 6000);
  S.day++;

}
function morningNews() {
  const ev = wpick(EVENTS);
  S.event = ev.id;

  }

}
// Cada mañana la ciudad cambia: la competencia abre locales nuevos y se amplía
function cityGrows() {
  const msgs = [], sale = lots.filter(l => l.kind === 'sale');
  if (sale.length > 30 && rnd() < 0.65) {
    const far = sale.filter(l => Math.hypot(l.x + l.w / 2 - P.x, l.y + l.h / 2 - P.y) > 220);
    const l = pick(far.length ? far : sale), opts = TYPES.filter(ty => ty.cost <= Math.min(160000, 60000 + S.day * 4000) && ty.fit[l.district] >= 1);
    if (opts.length) {
      l.kind = 'rival'; l.rival = { type: pick(opts).id, owner: pick(RIVAL_OWNERS), level: 1 };
      S.lotKinds[l.id] = 'rival'; S.rivals[l.id] = l.rival;
      setLotSolid(l); onLotChanged(l); recomputeCompetition();
      if (!inside && hitBox(P.x, P.y, 7)) { const k = nearestNode(P.x, P.y); P.x = nodes[k].x; P.y = nodes[k].y; } // adentro de un local no te mueve
      msgs.push(L(`Nuevo competidor: ${rivalName(l)} abrió en ${t(l.district)}`, `New rival: ${rivalName(l)} opened in ${t(l.district)}`)); if (S.mkt) bump('CON', 2);
    }
  }
  if (rnd() < 0.35) {
    const rs = lots.filter(l => l.kind === 'rival' && l.rival.level < 4);
    if (rs.length) { const l = pick(rs); l.rival.level++; S.rivals[l.id] = l.rival; onLotChanged(l); msgs.push(L(`${rivalName(l)} se amplió a nivel ${l.rival.level}`, `${rivalName(l)} expanded to level ${l.rival.level}`)); }
  }
  return msgs;
}
function checkGoals() {
  for (const g of GOALS) if (!S.goalsDone.includes(g.id) && g.test()) {
    S.goalsDone.push(g.id); S.money += g.r;
    toast(`🏆 ${g[LANG]}${g.r ? ' · ' + t('reward') + ' ' + fmt(g.r) : ''}`, 'good', 5000);
    sfx('goal');
    if (g.id === 'nw1m') banner(t('allGoals'), '🏆');
  }
  const next = GOALS.find(g => !S.goalsDone.includes(g.id));
  setText($goal, next ? `<b>${t('goal')}</b> ${next[LANG]}` : t('allGoals'), true);
}

const SHIRTS = ['#e63946', '#f1a208', '#2a9d8f', '#457b9d', '#9b5de5', '#f15bb5', '#00bbf9', '#06d6a0', '#ef476f', '#ffd166', '#3a86ff', '#8ac926', '#ff924c'];
const SKINS = ['#f1c27d', '#e0ac69', '#c68642', '#8d5524', '#ffdbac', '#a0673b'];
const HAIR = ['#2b1d14', '#5a3825', '#1b1b1b', '#c9a15a', '#8a3b12', '#d9d9d9'];
const CAR_COLORS = ['#e63946', '#f4f1de', '#3a86ff', '#2b2d42', '#ffbe0b', '#8ecae6', '#06d6a0', '#bc4749', '#6c757d', '#fb8500'];
const peds = [], cars = [], birds = [], parts = [], floats = [], boats = [];
const P = { x: 0, y: 0, vx: 0, vy: 0, face: 1, anim: 0, moving: false };
const cam = { x: 0, y: 0, w: 900, h: 900, yaw: 0, yawT: 0, zoom: 1, fx: 0, fy: 0 };  // caja visible del suelo (px) + cámara 3D
let viewW = 0, viewH = 0;

function newPed(node) {
  const n = nodes[node];
  return {
    x: n.x + (rnd() - .5) * 8, y: n.y + (rnd() - .5) * 8, from: node, to: pick(n.n), sp: 28 + rnd() * 22,
    shirt: pick(SHIRTS), skin: pick(SKINS), hair: pick(HAIR), pants: pick(['#2b2d42', '#3d405b', '#6b4f3a', '#1d3557']),
    mode: 'walk', t: 0, ph: rnd() * 6, bub: null, bubT: 0, dog: rnd() < 0.08, umb: rnd() < 0.7 ? pick(SHIRTS) : null,
    off: (rnd() - .5) * 12, tx: 0, ty: 0, after: null,
  };
}
function liveRect(m) { return { x0: cam.x - m, y0: cam.y - m, x1: cam.x + cam.w + m, y1: cam.y + cam.h + m }; }
function inRect(x, y, r) { return x > r.x0 && x < r.x1 && y > r.y0 && y < r.y1; }
function spawnPlace(margin) {
  // Nodo cercano a la cámara pero fuera de la vista, para que nadie aparezca de la nada
  const near = liveRect(margin), view = liveRect(20);
  for (let i = 0; i < 30; i++) { const k = (rnd() * nodes.length) | 0, n = nodes[k]; if (inRect(n.x, n.y, near) && !inRect(n.x, n.y, view)) return k; }
  return -1;
}
function crowdLevel() { const h = hour(); return (0.15 + 0.85 * curve('crowd', h)) * (S.weather === 'rain' ? 0.6 : 1) * (S.event === 'strike' ? 0.7 : 1); }
function updatePeds(dt) {
  const want = Math.round(14 + 34 * crowdLevel() * Math.min(1.4, (cam.w * cam.h) / 520000));
  const far = liveRect(700);
  for (let i = peds.length - 1; i >= 0; i--) if (!inRect(peds[i].x, peds[i].y, far) && peds[i].mode === 'walk') peds.splice(i, 1);
  if (peds.length < want && rnd() < 0.3) { const k = spawnPlace(450); if (k >= 0) peds.push(newPed(k)); }
  if (peds.length > want + 6) { const view = liveRect(30); const i = peds.findIndex(p => p.mode === 'walk' && !inRect(p.x, p.y, view)); if (i >= 0) peds.splice(i, 1); }
  for (const p of peds) {
    p.ph += dt * p.sp * 0.25;
    if (p.bubT > 0) { p.bubT -= dt; if (p.bubT <= 0) p.bub = null; }
    if (p.mode === 'walk') {
      const n = nodes[p.to], ox = p.off, tx = n.x + ox, ty = n.y + ox;
      const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
      // Evita al jugador
      const pd = Math.hypot(P.x - p.x, P.y - p.y);
      const slow = pd < 22 ? 0.2 : 1;
      if (d < 3) { const prev = p.from; p.from = p.to; const opts = nodes[p.to].n.filter(k => k !== prev); p.to = opts.length ? pick(opts) : prev; }
      else { p.x += dx / d * p.sp * slow * dt; p.y += dy / d * p.sp * slow * dt; p.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : -1) : p.dir; }
      if (!p.bub && rnd() < dt * 0.012) say(p, chatLine(p));
    } else if (p.mode === 'toDoor' || p.mode === 'exit') {
      const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy);
      if (d < 3) {
        if (p.mode === 'toDoor') { p.mode = 'inside'; p.t = 1.5 + rnd() * 2.5; }
        else p.mode = 'walk';
      } else { p.x += dx / d * p.sp * 1.3 * dt; p.y += dy / d * p.sp * 1.3 * dt; }
    } else if (p.mode === 'giver' || p.mode === 'follow' || p.mode === 'thief') {
      updateStreetPed(p, dt);
    } else if (p.mode === 'inside') {
      p.t -= dt;
      if (p.t <= 0) {
        p.mode = 'exit'; const n = nodes[p.to]; p.tx = n.x + p.off; p.ty = n.y + p.off;
        if (p.after) { say(p, p.after); p.after = null; }
      }
    }
  }
}
function chatLine(p) {
  const C = CHAT[LANG], h = hour();
  if (Math.hypot(P.x - p.x, P.y - p.y) < 90 && S.biz.length >= 2 && rnd() < 0.6) return pick(C.boss);
  if (S.weather === 'rain' && rnd() < 0.6) return pick(C.rain);
  if ((h > 21 || h < 5) && rnd() < 0.6) return pick(C.night);
  if (S.event === 'heat' && rnd() < 0.6) return pick(C.heat);
  return pick(C.gen);
}
function say(p, text) {
  let n = 0; for (const q of peds) if (q.bub) n++;
  if (n >= 3) return;
  p.bub = text; p.bubT = 3.2;
}
// Un cliente visible entra al local cuando hay venta cerca de la cámara
function onSaleVisual(b, amt, byPlayer) {
  const l = lotOf(b), view = liveRect(60);
  if (inside && inside.id === b.lot) {
    const r = interiorRegister(); floatText(r.x, r.y, '+' + fmt(amt), byPlayer ? '#ffb627' : '#46d98a');
    if (!byPlayer) interiorWalker(false);
    return;
  }
  if (!inRect(l.door.x, l.door.y, view)) return;
  floatText(l.door.x + (rnd() - .5) * 20, l.door.y - 34, '+' + fmt(amt), byPlayer ? '#ffb627' : '#46d98a');
  const C = CHAT[LANG], line = b.price === 2 && rnd() < .5 ? pick(C.pricey) : b.price === 0 && rnd() < .5 ? pick(C.cheap) : rnd() < .5 ? pick(C.good) : null;
  if (byPlayer) {
    // El cliente atendido sale caminando desde la puerta

    p.x = l.door.x; p.y = l.door.y; p.mode = 'exit'; const n = nodes[p.to]; p.tx = n.x; p.ty = n.y;
    if (line) say(p, line);
    peds.push(p); return;
  }
  let best = null, bd = 260 * 260;
  for (const p of peds) if (p.mode === 'walk') { const d = dist2(p.x, p.y, l.door.x, l.door.y); if (d < bd && clearLine(p.x, p.y, l.door.x, l.door.y)) { bd = d; best = p; } }
  if (best) { best.mode = 'toDoor'; best.tx = l.door.x + (rnd() - .5) * 10; best.ty = l.door.y; best.after = line; }
}
function nearestNode(x, y) { let k = 0, bd = Infinity; for (let i = 0; i < nodes.length; i++) { const d = dist2(x, y, nodes[i].x, nodes[i].y); if (d < bd) { bd = d; k = i; } } return k; }
function clearLine(x0, y0, x1, y1) { const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 14); for (let i = 1; i < n; i++) if (isSolidPx(lerp(x0, x1, i / n), lerp(y0, y1, i / n))) return false; return true; }
// Clientes "fantasma" de la competencia: la ciudad entera tiene movimiento
function rivalLife(dt) {
  const view = liveRect(40);
  for (const l of lots) if (l.kind === 'rival' && inRect(l.door.x, l.door.y, view) && rnd() < dt * 0.06 * curve(TYPE[l.rival.type].prof, hour())) {
    let best = null, bd = 220 * 220;
    for (const p of peds) if (p.mode === 'walk') { const d = dist2(p.x, p.y, l.door.x, l.door.y); if (d < bd && clearLine(p.x, p.y, l.door.x, l.door.y)) { bd = d; best = p; } }
    if (best) { best.mode = 'toDoor'; best.tx = l.door.x; best.ty = l.door.y; }
  }
}

// ---------- Tráfico ----------
// Carriles: tráfico por la derecha. Horizontal: este y=+1.5T, oeste y=+0.5T. Vertical: sur x=+0.5T, norte x=+1.5T.
const DIRS = { E: [1, 0], W: [-1, 0], S: [0, 1], N: [0, -1] };
const roadsIdx = []; for (let i = 0; i <= NB; i++) roadsIdx.push(i * BLK);
function laneCoord(dir, r) { return r * T + (dir === 'E' ? 1.5 : dir === 'W' ? 0.5 : dir === 'S' ? 0.5 : 1.5) * T; }
function newCar() {
  const view = liveRect(30), near = liveRect(500);
  for (let tries = 0; tries < 20; tries++) {
    const dir = pick(['E', 'W', 'S', 'N']), r = pick(roadsIdx);
    let x, y;
    if (dir === 'E' || dir === 'W') { y = laneCoord(dir, r); x = near.x0 + rnd() * (near.x1 - near.x0); }
    else { x = laneCoord(dir, r); y = near.y0 + rnd() * (near.y1 - near.y0); }
    x = clamp(x, T, (CITY - 1) * T); y = clamp(y, T, (CITY - 1) * T);
    if (inRect(x, y, view)) continue;
    return { x, y, dir, sp: 0, max: 80 + rnd() * 50, col: pick(CAR_COLORS), lastI: -1, kind: rnd() < 0.08 ? 'bus' : rnd() < 0.08 ? 'truck' : rnd() < 0.1 ? 'taxi' : 'car', blink: 0 };
  }

        if (rx && !ry && tx % BLK === 0) for (let i = 0; i < 2; i++) g.fillRect(px + K - 1, py + (4 + i * 16) * k, 2, 9 * k);

function updateIsland(dt) {

    let x, dir;
    if (c < 0.2) { x = a; dir = 1; } else if (c < 0.5) { const k = (c - 0.2) / 0.3; x = lerp(a, b, k * k * (3 - 2 * k)); dir = 1; } else if (c < 0.7) { x = b; dir = -1; } else { const k = (c - 0.7) / 0.3; x = lerp(b, a, k * k * (3 - 2 * k)); dir = -1; }

}

function serialize() {

}
function save(quiet = true) { if (!S || !running) return false; try { localStorage.setItem(SAVE_KEY, serialize()); if (!quiet) toast(L('Partida guardada', 'Game saved'), 'good'); return true; } catch (e) { if (!quiet) toast(L('No se pudo guardar. Revisa el almacenamiento del navegador.', "Couldn't save. Check your browser storage."), 'bad'); return false; } }

function setLang(v) {

  try { localStorage.setItem(LANG_KEY, v); } catch (e) { toast(L('No se pudo cambiar el idioma.', "Couldn't change the language."), 'bad'); return; }
  try { sessionStorage.setItem('emprende-city:skip-splash', '1'); } catch (e) { }
  save(); location.reload();
}
function loadSaved() {

    const d = JSON.parse(raw); if (!d) return null;
    if (d.v === 1) { d.player.x += OX * BLK * T; d.v = 2; }  // ciudad más grande: la parte original se movió al este

}
function hydrate(d) {
  S = Object.assign(newState(d.brand), d);
  S.stats = Object.assign({ served: 0, collected: 0, buyouts: 0, earned: 0 }, d.stats || {});
  S.lotKinds = d.lotKinds || {}; S.rivals = d.rivals || {};
  for (const id in S.rivals) lots[id].rival = S.rivals[id];
  for (const id in S.lotKinds) { lots[id].kind = S.lotKinds[id]; setLotSolid(lots[id]); }
  for (const b of S.biz) { b.queue = []; b.arr = 0; b.tok = 0; lots[b.lot].kind = 'biz'; setLotSolid(lots[b.lot]); }
  // Ganancias mientras no estabas (solo negocios con gerente y personal), máximo 1 hora real
  const away = Math.min(3600, Math.max(0, (Date.now() - (d.savedAt || Date.now())) / 1000));
  if (away > 60) {
    let gain = 0;
    for (const b of S.biz) if (b.manager && b.staff > 0) gain += Math.max(0, b.yProfit) * (away / (1440 / MIN_PER_SEC)) * 0.5;
    if (gain >= 1) { S.money += gain; setTimeout(() => toast(`${t('offline')} ${fmt(gain)}`, 'good', 6000), 600); }
  }
}

let running = false, last = 0, acc = 0, hudT = 0, ctxT = 0, saveT = 0, minimapT = 0;
const STEP = 1 / 30;
function frame(ts) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  if (!running || document.hidden) return;
  if (sheet && ['pause','guide','replace'].includes(sheet.kind)) { if (S) updateHUD(); render(0); return; }
  now += dt;
  acc += dt;
  while (acc >= STEP) { tick(STEP); acc -= STEP; }
  // Cámara suave que mira un poco hacia donde caminas
  insideK = lerp(insideK, inside ? 1 : 0, Math.min(1, dt * 4)); if (Math.abs(insideK - (inside ? 1 : 0)) < 0.002) insideK = inside ? 1 : 0;
  const tfx = inside ? (inside.geo.rx0 + inside.geo.rx1) / 2 : P.x + P.vx * 0.3, tfy = inside ? (inside.geo.ry0 + inside.geo.ry1) / 2 : P.y + P.vy * 0.3;
  cam.fx = lerp(cam.fx, tfx, Math.min(1, dt * 5)); cam.fy = lerp(cam.fy, tfy, Math.min(1, dt * 5));
  updateCamera(dt, cam.fx, cam.fy, false);
  render(dt);
  autoQuality(dt);
  musicTick();
  hudT -= dt; if (hudT <= 0) { hudT = 0.12; updateHUD(); }
  minimapT -= dt; if (minimapT <= 0) { minimapT = 0.2; drawMiniMap(); }
}
function tick(dt) {
  const prevH = hour(), prevMin = S.min;
  S.min += dt * MIN_PER_SEC;
  const dtMin = dt * MIN_PER_SEC;
  if (Math.floor(S.min / 1440) > Math.floor(prevMin / 1440)) endOfDay();
  if (Math.floor(S.min / 10) > Math.floor(prevMin / 10)) marketStep(10);
  if (Math.floor(S.min / 30) > Math.floor(prevMin / 30)) marketHistory();
  const h = hour();
  if (prevH < 7 && h >= 7) morningNews();
  updatePlayer(dt);
  simEconomy(dtMin, dt);
  updatePeds(dt); rivalLife(dt); updateCars(dt); updateBirds(dt); updateParticles(dt);
  rainK = lerp(rainK, S.weather === 'rain' ? 1 : 0, dt * 0.3);
  cloudK = lerp(cloudK, S.weather === 'sun' ? 0 : 1, dt * 0.3);
  if (rnd() < dt * 0.6 && rainK < 0.2) { const tr = pick(trees); if (inRect(tr.x, tr.y, liveRect(0))) spawnParticle('leaf', tr.x, tr.y, 45); }
  ambientParticles(dt);
  interiorTick(dt);
  streetTick(dt, dtMin);
  if (darkness() < 0.3 && rainK < 0.3 && rnd() < dt * 0.05) { const tr = trees.find(tr => dist2(tr.x, tr.y, P.x, P.y) < 250 * 250); if (tr) sfx('chirp'); }
  // Cobro automático al pasar por la puerta
  // (como máximo cada 2.5 s: con muchas ventas no se llena la pantalla de monedas)
  for (const b of S.biz) if (!b.manager && b.cash >= 1 && !(S.min - (b.colT ?? -99) < 5) && playerNearDoor(lotOf(b), 46)) { b.colT = S.min; collect(b); }
  if (hour() >= 22 && S.hintNight !== S.day && !(inside && inside.home)) { S.hintNight = S.day; toast(L('🌙 Ya es tarde. Ve a tu casa a dormir (Móvil › 🏠 Ir a casa).', "🌙 It's late. Go home to sleep (Phone › 🏠 Go home)."), '', 6000); }
  ctxT -= dt; if (ctxT <= 0) { ctxT = 0.1; findContext(); districtCheck(); checkGoals(); }
  saveT -= dt; if (saveT <= 0) { saveT = 20; save(); }
  liveTimer -= dt; if (liveTimer <= 0) { liveTimer = 1; if (sheet && !uiPressing && (sheet.kind === 'manage' || sheet.kind === 'stock' || (sheet.kind === 'phone' && phoneTab === 'mkt') || (sheet.kind === 'phone' && phoneTab === 'biz'))) drawSheet(); }
}
function ambientParticles(dt) {
  const view = liveRect(80);
  for (const p of smokePts) if (inRect(p.x, p.y, view) && rnd() < dt * 2.5) spawnParticle('smoke', p.x, p.y, p.h);
  if (inRect(FOUNTAIN.x, FOUNTAIN.y, view)) for (let i = 0; i < 2; i++) if (rnd() < 0.7) spawnParticle('drop', FOUNTAIN.x, FOUNTAIN.y, 38);

let giver = null, thief = null, follower = null, nearGiver = false, giverT = 20;

function lotLabel(l) { const b = bizAtLot(l.id); return b ? bizName(b) : l.kind === 'rival' ? rivalName(l) : L(`el terreno en venta (${t(l.district)})`, `the lot for sale (${t(l.district)})`); }
function removePed(p) { const i = peds.indexOf(p); if (i >= 0) peds.splice(i, 1); }
function spawnGiver() {

  openSheet('mission', () => ({
    title: vip ? L('Cliente VIP', 'VIP customer') : L('Encargo', 'Favor'), em: vip ? '🕴️' : '📦', body: `

function completeMission() {

function failMission(reason) {

  follower = null; S.mission = null; S.streak = 0; waypoint = null;

// Robos: solo a negocios sin gerente, con buena caja y cerca de ti (siempre se puede perseguir)
function robberyCheck(dtMin) {
  if (thief || inside || sleeping) return;
  if (S.min - (S.lastRob ?? -9999) < 180) return;
  const p10 = darkness() > 0.5 ? 0.05 : 0.012;
  for (const b of S.biz) {
    if (b.manager || b.cash < Math.max(60, regCap(b) * 0.3)) continue;
    const l = lotOf(b), d = Math.hypot(l.door.x - P.x, l.door.y - P.y);

}
function startRobbery(b) {
  const l = lotOf(b), loot = Math.round(b.cash * 0.7), k = nearestNode(l.door.x, l.door.y), p = newPed(k);

  toast(L(`🚨 ¡Asaltaron ${bizName(b)}! Se llevó ${fmt(loot)}. ¡Atrápalo!`, `🚨 ${bizName(b)} got robbed! The thief took ${fmt(loot)}. Catch them!`), 'bad', 5000);

function updateStreetPed(p, dt) {
  if (p.mode === 'giver') return;                 // espera parado a que le hables
  if (p.mode === 'follow') {                      // el VIP te sigue (y se sube contigo si vas en vehículo)
    if (inside) return;                           // te espera afuera
    const tx = P.x - Math.cos(P.ang || 0) * 26, ty = P.y - Math.sin(P.ang || 0) * 26, dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
    if (d > 240) { p.x = tx; p.y = ty; }
    else if (d > 6) { const sp = Math.min(d * 3, 170); p.x += dx / d * sp * dt; p.y += dy / d * sp * dt; }
    return;
  }
  if (p.mode === 'thief') {                       // corre alejándose de ti; se cansa después de 14 s
    p.t += dt;
    const n = nodes[p.to], dx = n.x - p.x, dy = n.y - p.y, d = Math.hypot(dx, dy), sp = p.t < 14 ? 118 : 82;
    p.ph += dt * sp * 0.3;

      for (const k of nodes[p.to].n) { const q = nodes[k], dd = Math.hypot(q.x - P.x, q.y - P.y) + rnd() * 60; if (dd > bd) { bd = dd; best = k; } }

function streetTick(dt, dtMin) {

    else if (!giver.bub && rnd() < dt * 0.15) say(giver, pick(L(['¡Oye! ¿Me ayudas?', '¡Por aquí!', 'Necesito un favor'], ['Hey! Can you help me?', 'Over here!', 'I need a favor'])));
  } else {

    if (m.kind === 'vip' && !follower) failMission(L('El cliente VIP se perdió', 'The VIP customer got lost'));

      S.money += thief.loot + bonus; S.stats.caught = (S.stats.caught || 0) + 1; if (b) b.rep = Math.min(100, b.rep + 3);
      floatText(P.x, P.y, '+' + fmt(thief.loot + bonus), '#46d98a', 1.5);
      for (let i = 0; i < 14; i++) spawnParticle('coin', P.x, P.y);
      toast(L(`👮 ¡Atrapaste al ladrón! Recuperaste ${fmt(thief.loot)} y la policía te dio ${fmt(bonus)} de recompensa.`, `👮 You caught the thief! You got back ${fmt(thief.loot)} and the police gave you a ${fmt(bonus)} reward.`), 'good', 5000);
      sfx('goal'); vibrate(40); endThief();
    } else if (d > Math.max(1000, thief.d0 + 500) || thief.t > 45) { toast(L(`💨 El ladrón escapó con ${fmt(thief.loot)}. Un gerente evita los robos.`, `💨 The thief got away with ${fmt(thief.loot)}. A manager prevents robberies.`), 'bad', 5000); endThief(); }
  } else robberyCheck(dtMin);
}

 openSheet('guide',()=>({title:L('De tu primera venta a un imperio', 'From your first sale to an empire'),em:'✦',body:`
 <p class="note">${L('Juego en pausa mientras consultas esta guía.', 'The game is paused while you read this guide.')}</p>
 <div class="guide-step">${L('<b>01 · Encuentra tu lugar</b><br>Empiezas con $800. Busca un local en venta y abre un puesto de limonada. El barrio cambia el precio y la demanda.', '<b>01 · Find your spot</b><br>You start with $800. Find a lot for sale and open a lemonade stand. The neighborhood changes the price and the demand.')}</div>
 <div class="guide-step">${L('<b>02 · Atiende y crece</b><br>Entra, atiende a los clientes y recoge el dinero de la caja acercándote a la puerta. Gestiona tu local para contratar personal y subir de nivel.', '<b>02 · Serve and grow</b><br>Go in, serve customers and collect the register by walking up to the door. Manage your place to hire staff and level up.')}</div>
 <div class="guide-step">${L('<b>03 · Piensa a largo plazo</b><br>Reserva dinero para gastos diarios. Completa metas para ganar premios. Un gerente cobra por ti; dormir en casa te da un bonus de ventas.', '<b>03 · Think long term</b><br>Keep cash for daily costs. Complete goals to earn rewards. A manager collects for you; sleeping at home gives you a sales bonus.')}</div>
 <button class="btn primary" data-a="starterRoute">${L('📍 Buscar un local asequible', '📍 Find an affordable lot')}</button>
 <p class="note">${L('WASD / flechas: caminar · Espacio: acción · E: gestionar · F: entrar / salir · M: mapa · P: móvil · Q / R: cámara · Z: zoom · Esc: pausa. En móvil, arrastra el lado izquierdo para moverte y utiliza los botones de acción.', 'WASD / arrows: walk · Space: action · E: manage · F: enter / exit · M: map · P: phone · Q / R: camera · Z: zoom · Esc: pause. On mobile, drag on the left side to move and use the action buttons.')}</p>
 <button class="btn" data-close>${L('¡Vamos a emprender!', "Let's build an empire!")}</button>`}));
}
ACTIONS.guide=openGuide;
ACTIONS.saveNow=()=>save(false);
ACTIONS.starterRoute=()=>{
 if(inside){toast(L('Sal del edificio para buscar un local.', 'Leave the building to look for a lot.'),'',3500);return;}
 if(S.mission){toast(L('Termina el encargo antes de cambiar la ruta.', 'Finish the favor before changing the route.'),'',3500);return;}
 const options=lots.filter(l=>l.kind==='sale' && regionOf(l.door.x)===regionOf(P.x) && priceOf('lemon',l.district)<=S.money);
 options.sort((a,b)=>dist2(a.door.x,a.door.y,P.x,P.y)-dist2(b.door.x,b.door.y,P.x,P.y));
 const l=options[0];if(!l){toast(L('No hay locales asequibles en esta zona. Haz encargos para reunir dinero.', 'No affordable lots in this area. Do favors to raise money.'),'',5000);return;}
 closeSheet();const cost=L('Limonada desde ', 'Lemonade from ')+fmt(priceOf('lemon',l.district))+' · '+t(l.district);
 if(dist2(l.door.x,l.door.y,P.x,P.y)<60*60){toast(L('¡Tienes uno aquí mismo! Pulsa Comprar. ', 'There is one right here! Tap Buy. ')+cost,'good',6000);return;} // la ruta se borraría al instante
 waypoint={x:l.door.x,y:l.door.y};toast(L('Sigue la flecha dorada. ', 'Follow the golden arrow. ')+cost,'good',6000);
};
ACTIONS.lang = v => setLang(v);
$('btnGuide').onclick=openGuide;$('btnPause').onclick=openPause;

// ---------- Inicio ----------
function startGame(state) {
  S = state;
  initMarket();
  setHomeFromLevel();
  cam.zoom = 1;
  P.x = S.player.x; P.y = S.player.y;
  if (hitBox(P.x, P.y, 7)) { const k = nearestNode(P.x, P.y); P.x = nodes[k].x; P.y = nodes[k].y; }
  resize();
  cam.fx = P.x; cam.fy = P.y; cam.yaw = cam.yawT = 0;
  updateCamera(0, cam.fx, cam.fy, false);
  recomputeCompetition();
  syncAllLots();
  perf.t = 0; perf.n = 0; perf.done = false;
  applyStaticText();
  ['hud', 'topright', 'actions', 'ticker'].forEach(id => $(id).hidden = false);
  $ui.innerHTML = '';
  peds.length = 0; cars.length = 0;
  clearStreet();
  if (S.mission) { const l = lots[S.mission.lot]; waypoint = { x: l.door.x, y: l.door.y }; }
  setTicker(EVENTS.find(e => e.id === S.event)?.[LANG] || FLAVOR[LANG][0]);
  for (let i = 0; i < 26; i++) { const k = spawnPlace(700); if (k >= 0) { const p = newPed(k); peds.push(p); } }
  // Algunos peatones ya visibles al empezar para que la calle no esté vacía
  const view = liveRect(0);
  for (let i = 0, n = 0; i < nodes.length && n < 8; i++) if (inRect(nodes[i].x, nodes[i].y, view)) { peds.push(newPed(i)); n++; }
  for (let i = 0; i < 8; i++) { const c = newCar(); if (c) cars.push(c); }
  if (!S.seenHint) { const hm = $('hintMove'); hm.textContent = matchMedia('(pointer:coarse)').matches ? t('moveHint') : t('moveHintKb'); hm.hidden = false; }
  lastDistrict = ''; running = true;
  if (S.day === 1 && S.min < 7 * 60 + 5 && !S.biz.length) toast(t('welcome') + ' · ' + t('tagline'), 'good', 7000);
  checkGoals();
}
function titleScreen() {
  applyStaticText();
  const saved = loadSaved();
  const draw = () => {
    $ui.innerHTML = `<div class="title"><div class="card">
      <h1>Tycoon<span>City 3D</span></h1>
      <div class="seg" role="group" aria-label="${t('lang')}"><button data-a="lang" data-v="es" class="${LANG === 'es' ? 'on' : ''}" lang="es">Español</button><button data-a="lang" data-v="en" class="${LANG === 'en' ? 'on' : ''}" lang="en">English</button></div>
      <p>${t('tagline')}</p>
      ${saved ? `<button class="btn primary" id="tContinue">${t('cont')} · ${t('day')} ${saved.day} · ${fmtK(saved.money)}</button>` : ''}
      <label class="lbl" for="tBrand" style="margin:0">${t('brandAsk')}</label>
      <input id="tBrand" maxlength="16" value="${esc(saved ? saved.brand : L('Emprende', 'Tycoon'))}" autocomplete="off" aria-label="${t('brandAsk')}">
      <button class="btn ${saved ? '' : 'primary'}" id="tNew">${saved ? t('newGame') : t('play')}</button>
      <p class="keys">${t('keys')}</p></div></div>`;
    $('tNew').onclick = () => { audioInit(); const brand = ($('tBrand').value || L('Emprende', 'Tycoon')).trim().slice(0, 16); const begin = () => { startGame(newState(brand)); save(); openGuide(); }; if (saved) { openSheet('replace', () => ({title:L('¿Empezar de nuevo?', 'Start over?'), em:'↻', body:`<p class=note>${L('La nueva partida sustituirá tu progreso guardado.', 'A new game will replace your saved progress.')}</p><button class="btn danger" data-a=confirmNew>${L('Crear nueva partida', 'Start a new game')}</button><button class="btn primary" data-a=cancelNew>${L('Conservar mi partida', 'Keep my game')}</button>`})); ACTIONS.confirmNew = begin; ACTIONS.cancelNew = closeSheet; } else begin(); };
    if (saved) $('tContinue').onclick = () => { audioInit(); hydrate(saved); startGame(S); };
  };
  draw();
  // Fondo animado: la ciudad de noche detrás del título
  S = newState(''); S.min = 19.6 * 60; P.x = -9999; P.y = -9999; resize();
  cam.zoom = 1.25; cam.yaw = 0.6;
  const fx = FOUNTAIN.x, fy = FOUNTAIN.y;
  updateCamera(0, fx, fy, true); recomputeCompetition(); syncAllLots();
  for (let i = 0; i < 40; i++) { const k = spawnPlace(600); if (k >= 0) peds.push(newPed(k)); }
  const demo = ts => {
    if (running) return;
    requestAnimationFrame(demo);
    const dt = 1 / 60; now += dt; S.min += dt * 4;
    updateCamera(dt, fx, fy, true);
    updatePeds(dt); updateCars(dt); updateBirds(dt); ambientParticles(dt); updateParticles(dt);
    render(dt);
  };
  requestAnimationFrame(demo);
}
// Recarga en caliente del visor de artifacts: conserva la partida
window.claude?.hot?.snapshot?.(() => (S && running ? serialize() : null));

buildWorld(); buildNodes(); buildMapBase(); initBirds();
initRenderer(); resize();
const hotData = window.claude?.hot?.data;
if (typeof hotData === 'string') { try { const d = JSON.parse(hotData); hydrate(d); startGame(S); } catch (e) { titleScreen(); } }
else titleScreen();
requestAnimationFrame(frame);
window.dispatchEvent(new Event('era-ready'));   // quita la entrada de ERAGames
</script>
</body>
</html>
