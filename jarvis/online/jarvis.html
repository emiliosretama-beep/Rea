<title>Jarvis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
<style>
/* Layout: una sola pantalla tipo instrumento de cabina. Columna de chat con el
   núcleo (el sol de ERA) como único protagonista; Tareas y Memoria van en una
   hoja sobre el chat (teléfono) o en una columna fija a la derecha (≥ 960 px).
   Tema oscuro único a propósito: es un HUD. */
:root {
  --noche: #080b1f; /* fondo (60 %) */
  --panel: #12183a; /* burbujas, campos, hojas (30 %) */
  --panel-alto: #1a2250;
  --linea: #2b3570; /* trazos del HUD */
  --texto: #eef0fa;
  --tenue: #9aa3cc;
  --era: #f04e23; /* naranja ERA: solo lo que está vivo (10 %) */
  --amanecer: #ffb089; /* luz del núcleo, del degradado del logo */
  --sobre-era: #080b1f; /* texto sobre naranja: blanco no da contraste */
  --mal: #ff8a8a;
  --brillo: rgba(240, 78, 35, 0.46);
  --sombra: rgba(0, 0, 0, 0.45);
  --f-display: "Chakra Petch", "Trebuchet MS", "Segoe UI", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease-soft: cubic-bezier(0.45, 0.05, 0.25, 1);
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --energy: 0; /* 0 a 1: lo mueve core.js con cada trozo de texto */
  color-scheme: dark;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

/* El visor ya mete el safe-area en :root; la app ocupa justo lo que queda. */
html {
  height: 100%;
  background: var(--noche);
}
@supports (height: 100dvh) {
  html {
    height: 100dvh;
  }
}
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--noche);
  color: var(--texto);
  font: 400 16px/1.5 var(--f-body);
  -webkit-text-size-adjust: 100%;
}
button,
input,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
:focus-visible {
  outline: 2px solid var(--amanecer);
  outline-offset: 2px;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.icon {
  flex: none;
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ---------- Estructura ---------- */

.app {
  position: relative;
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
}
.shell {
  width: 100%;
  max-width: 860px;
  min-width: 0;
  min-height: 0;
  height: 100%;
  margin-inline: auto;
  padding-left: var(--gutter-l);
  padding-right: var(--gutter-r);
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto auto minmax(0, 1fr) auto;
}
/* Fila fija por pieza: si el aviso está oculto, las demás no se recorren. */
.top {
  grid-row: 1;
}
.modes {
  grid-row: 2;
}
.notice {
  grid-row: 3;
}
.main {
  grid-row: 4;
}
.composer {
  grid-row: 5;
}

/* ---------- Encabezado ---------- */

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 60px;
  padding-block: 8px 6px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.brand-text {
  min-width: 0;
}
.wordmark {
  margin: 0;
  font: 600 17px/1 var(--f-display);
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.status {
  margin: 5px 0 0;
  font: 500 12px/1 var(--f-display);
  letter-spacing: 0.04em;
  color: var(--tenue);
  white-space: nowrap;
}
.top-actions {
  flex: none;
  display: flex;
  gap: 6px;
}
.tool {
  min-width: 44px;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 0 10px;
  border: 1px solid var(--linea);
  border-radius: 12px;
  background: transparent;
  font: 600 13px/1 var(--f-display);
  letter-spacing: 0.03em;
  transition:
    background-color 0.15s,
    transform 0.15s var(--ease-out);
}
.tool:active {
  background: var(--panel);
  transform: scale(0.96);
}
.tool--icon {
  padding: 0;
}
.tool-count {
  color: var(--amanecer);
  font-variant-numeric: tabular-nums;
}
@media (hover: hover) {
  .tool:hover,
  .chip:hover {
    background: var(--panel-alto);
  }
}
/* En teléfono el encabezado se queda con iconos donde no cabe el texto. */
@media (max-width: 479px) {
  .tool-label--wide {
    display: none;
  }
  #openMemory {
    padding: 0;
  }
}
@media (max-width: 379px) {
  .tool-label--mid {
    display: none;
  }
}

/* ---------- Modos ---------- */

.modes,
.side-tabs {
  display: grid;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--linea);
  border-radius: 14px;
}
.modes {
  max-width: 480px; /* en iPad y escritorio no se estira a todo el ancho */
  grid-template-columns: repeat(4, minmax(0, 1fr));
}
.mode {
  min-height: 40px;
  padding: 0 4px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--tenue);
  font: 600 12.5px/1 var(--f-display);
  letter-spacing: 0.02em;
  white-space: nowrap;
  transition:
    background-color 0.18s var(--ease-out),
    color 0.18s;
}
.mode[aria-pressed="true"] {
  background: var(--era);
  color: var(--sobre-era);
}

/* ---------- Aviso (modo demo, sin memoria) ---------- */

.notice,
.sync {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 4px 4px 12px;
  border: 1px dashed var(--linea);
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.35;
  color: var(--tenue);
}
.notice {
  margin-top: 8px;
}
.notice p,
.sync p {
  flex: 1;
  min-width: 0;
  margin: 0;
  padding-block: 8px;
}
.notice button,
.sync button {
  flex: none;
  min-height: 44px;
  padding: 0 12px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  font: 600 12px/1 var(--f-display);
  letter-spacing: 0.04em;
  color: var(--texto);
}

/* ---------- Zona central: inicio o conversación ---------- */

.main {
  position: relative;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--linea) transparent;
}
.hero {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding-block: 16px;
  text-align: center;
}
[data-view="chat"] .hero {
  display: none;
}
/* Mientras el núcleo vuela al encabezado, el inicio sigue en su sitio: va
   fijo (app.js le da su caja) para que el scroll del chat no lo recorte. */
.is-docking .hero {
  position: fixed;
  z-index: 5;
  display: flex;
  pointer-events: none;
}
.is-docking .hero > :not(.core-slot) {
  opacity: 0;
  transition: opacity 0.16s;
}
.greeting {
  margin: 14px 0 0;
  font: 600 22px/1.2 var(--f-display);
  letter-spacing: 0.01em;
  text-wrap: balance;
}
.telemetry {
  margin: 0;
  font-size: 14px;
  color: var(--tenue);
  font-variant-numeric: tabular-nums;
}
.chips {
  max-width: 520px;
  margin-top: 14px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
}
.chip {
  min-height: 44px;
  padding: 0 14px;
  border: 1px solid var(--linea);
  border-radius: 999px;
  background: var(--panel);
  font-size: 14px;
  transition: transform 0.15s var(--ease-out);
}
.chip:active {
  transform: scale(0.97);
}

/* ---------- El núcleo ---------- */

.core-slot {
  flex: none;
  display: block;
}
.core-slot--hero {
  width: clamp(96px, 22vh, 176px);
  aspect-ratio: 1;
}
/* Pantallas bajas (iPhone con las barras de Safari): inicio más compacto. */
@media (max-height: 700px) {
  .core-slot--hero {
    width: clamp(96px, 18vh, 128px);
  }
  .hero {
    padding-block: 8px;
  }
  .greeting {
    margin-top: 8px;
    font-size: 20px;
  }
  .chips {
    margin-top: 8px;
  }
}
.core-slot--mini {
  display: none;
  width: 38px;
  height: 38px;
}
[data-view="chat"] .core-slot--mini {
  display: block;
}
.is-docking .core-slot--mini {
  visibility: hidden;
}
.core {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  transform-origin: 0 0;
}
.core-layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}
.core-glow {
  position: absolute;
  inset: -18%;
  border-radius: 50%;
  background: radial-gradient(circle, var(--brillo) 0%, transparent 64%);
  opacity: 0.38;
}
.core-ring circle,
.core-ticks circle,
.core-arc circle {
  fill: none;
}
.core-ring circle {
  stroke: var(--linea);
  stroke-width: 1;
}
.tick-minor {
  stroke: var(--linea);
  stroke-width: 7;
}
.tick-major {
  stroke: var(--tenue);
  stroke-width: 11;
}
.core-arc--a circle {
  stroke: var(--era);
  stroke-width: 2.5;
  stroke-linecap: round;
}
.core-arc--b circle {
  stroke: var(--amanecer);
  stroke-width: 1.5;
  stroke-linecap: round;
  opacity: 0.7;
}
.sun-top {
  stop-color: var(--amanecer);
}
.sun-bottom {
  stop-color: var(--era);
}

/* En el encabezado el núcleo se simplifica: sol y un arco. */
.core--mini .core-ring,
.core--mini .core-ticks,
.core--mini .core-arc--b {
  display: none;
}
.core--mini .core-arc--a circle {
  stroke-width: 9;
}
.core--mini .core-sun {
  scale: 1.55;
}
.core--mini .core-glow {
  inset: -8%;
}

/* Estados sin movimiento: también valen con prefers-reduced-motion. */
[data-core="thinking"] .tick-minor {
  stroke: var(--tenue);
}
[data-core="thinking"] .core-arc--b circle {
  opacity: 1;
}
[data-core="speaking"] .tick-major {
  stroke: var(--amanecer);
}
[data-core="speaking"] .core-glow {
  opacity: 0.6;
}
[data-core="listening"] .core-arc--a circle {
  stroke: var(--amanecer);
}

@media (prefers-reduced-motion: no-preference) {
  .core-arc--a {
    animation: core-spin 26s linear infinite;
  }
  .core-arc--b {
    animation: core-spin 38s linear infinite reverse;
  }
  .core-sun {
    animation: core-breathe 5.6s var(--ease-soft) infinite;
  }
  .core-glow {
    animation: core-glow 5.6s var(--ease-soft) infinite;
  }
  .core-ticks,
  .core-sun,
  .core-glow {
    transition:
      transform 0.16s var(--ease-out),
      opacity 0.16s var(--ease-out);
  }
  [data-core="thinking"] .core-sun {
    animation: core-think 1.1s ease-in-out infinite;
  }
  [data-core="listening"] .core-sun {
    animation: core-breathe 1.5s var(--ease-soft) infinite;
  }
  /* Hablando: las marcas se abren con cada trozo de texto que llega. */
  [data-core="speaking"] .core-sun,
  [data-core="speaking"] .core-glow {
    animation: none;
  }
  [data-core="speaking"] .core-ticks {
    transform: scale(calc(1 + var(--energy) * 0.1));
  }
  [data-core="speaking"] .core-sun {
    transform: scale(calc(1 + var(--energy) * 0.07));
  }
  [data-core="speaking"] .core-glow {
    opacity: calc(0.4 + var(--energy) * 0.5);
  }
  .msg--assistant[data-status="streaming"] .md > :last-child::after {
    animation: caret 1s steps(2, jump-none) infinite;
  }
  .thinking {
    animation: fade 1.4s ease-in-out infinite;
  }
  [data-panel="tasks"] .side,
  [data-panel="memory"] .side,
  [data-panel="voice"] .side {
    animation: sheet-in 0.26s var(--ease-out);
  }
  .toast {
    animation: toast-in 0.22s var(--ease-out);
  }
}
/* Con "reducir movimiento" no se mueve nada: el estado se lee en texto. */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}
@keyframes core-spin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes core-breathe {
  50% {
    transform: scale(1.035);
  }
}
@keyframes core-glow {
  50% {
    opacity: 0.55;
  }
}
@keyframes core-think {
  50% {
    transform: scale(0.94);
    opacity: 0.7;
  }
}
@keyframes caret {
  to {
    opacity: 0;
  }
}
@keyframes fade {
  50% {
    opacity: 0.45;
  }
}
@keyframes sheet-in {
  from {
    transform: translateY(24px);
    opacity: 0;
  }
}
@keyframes toast-in {
  from {
    transform: translate(-50%, 12px);
    opacity: 0;
  }
}

/* ---------- Conversación ---------- */

.log {
  display: none;
  flex-direction: column;
  gap: 12px;
  margin: 0;
  padding: 16px 0 20px;
  list-style: none;
}
[data-view="chat"] .log {
  display: flex;
}
/* Cada pregunta queda pegada a su respuesta y separada del turno anterior. */
.msg--user:not(:first-child),
.msg--mode:not(:first-child) {
  margin-top: 12px;
}
/* El texto se desvanece en los bordes del scroll en vez de cortarse en seco. */
[data-view="chat"] .main::before,
[data-view="chat"] .main::after {
  content: "";
  position: sticky;
  z-index: 2;
  flex: none;
  height: 16px;
  pointer-events: none;
}
[data-view="chat"] .main::before {
  top: 0;
  margin-bottom: -16px;
  background: linear-gradient(var(--noche), transparent);
}
[data-view="chat"] .main::after {
  bottom: 0;
  margin-top: -16px;
  background: linear-gradient(transparent, var(--noche));
}
.msg {
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.msg--user {
  align-items: flex-end;
}
.msg--assistant {
  gap: 8px;
}
.msg--mode {
  align-items: center;
}
.msg--mode span {
  padding: 6px 12px;
  border: 1px solid var(--linea);
  border-radius: 999px;
  font: 500 12px/1 var(--f-display);
  letter-spacing: 0.08em;
  color: var(--tenue);
}
.bubble {
  max-width: min(86%, 560px);
  padding: 10px 14px;
  border: 1px solid var(--linea);
  border-radius: 18px 18px 6px 18px;
  background: var(--panel);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

/* Texto de Jarvis (Markdown): sin burbuja, a todo el ancho de lectura. */
.md {
  max-width: 68ch;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  line-height: 1.55;
  overflow-wrap: anywhere;
}
.md p,
.md ul,
.md ol,
.md h3,
.md h4,
.md blockquote {
  margin: 0;
}
.md ul,
.md ol {
  padding-left: 1.35em;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.md li > ul,
.md li > ol,
.md li > p,
.md li > .code {
  margin-top: 6px;
}
.md h3 {
  font: 600 17px/1.3 var(--f-body);
}
.md h4 {
  font: 600 16px/1.3 var(--f-body);
}
.md strong {
  font-weight: 600;
}
.md a {
  color: var(--amanecer);
  text-underline-offset: 2px;
}
.md code {
  padding: 0.12em 0.36em;
  border-radius: 6px;
  background: var(--panel);
  font: 0.875em/1.4 var(--f-mono);
}
.md blockquote {
  padding-left: 12px;
  border-left: 2px solid var(--linea);
  color: var(--tenue);
}
.md hr {
  width: 100%;
  margin: 0;
  border: 0;
  border-top: 1px solid var(--linea);
}
.code {
  min-width: 0;
  border: 1px solid var(--linea);
  border-radius: 12px;
  background: var(--panel);
  overflow: hidden;
}
.code-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-left: 12px;
  border-bottom: 1px solid var(--linea);
  font: 500 12px/1 var(--f-display);
  letter-spacing: 0.04em;
  color: var(--tenue);
}
.code pre {
  margin: 0;
  padding: 12px;
  overflow-x: auto;
  font: 13.5px/1.5 var(--f-mono);
  tab-size: 2;
}
.code pre code {
  padding: 0;
  background: none;
  font: inherit;
}
.table-wrap {
  max-width: 100%;
  overflow-x: auto;
}
.md table {
  border-collapse: collapse;
  font-size: 14px;
}
.md th,
.md td {
  padding: 6px 10px;
  border: 1px solid var(--linea);
  text-align: left;
  vertical-align: top;
}
.md th {
  background: var(--panel);
  font-weight: 600;
}
.thinking {
  color: var(--tenue);
}
.msg--assistant[data-status="streaming"] .md > :last-child::after {
  content: "▍";
  margin-left: 2px;
  color: var(--era);
}
.msg-note {
  margin: 0;
  font-size: 13px;
  color: var(--tenue);
}
.msg-note--error {
  color: var(--mal);
}

/* Lo que Jarvis hizo con tareas y recuerdos durante la respuesta. */
.acts {
  max-width: 68ch;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  list-style: none;
}
.act {
  max-width: 100%;
  min-height: 34px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  border: 1px solid var(--linea);
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.35;
  color: var(--tenue);
}
.act:has(button) {
  padding-right: 2px;
}
.act::before {
  content: "";
  flex: none;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--amanecer);
}
.act--failed::before {
  background: var(--mal);
}
.act span {
  flex: 1;
  min-width: 0;
  padding-block: 6px;
  overflow-wrap: anywhere;
}
.msg-tools {
  margin-left: -10px;
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
}
.msg-tools button,
.act button,
.code-copy {
  flex: none;
  min-height: 40px;
  padding: 0 10px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  font: 600 12px/1 var(--f-display);
  letter-spacing: 0.04em;
  color: var(--tenue);
}
.act button,
.code-copy {
  color: var(--texto);
}
.msg-tools button[aria-pressed="true"] {
  color: var(--amanecer);
}

/* ---------- Caja de texto ---------- */

.composer {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 8px;
  padding-block: 8px 10px;
}
/* Modo voz: qué hacer para hablarle, encima de la caja. */
.voice-hint {
  flex: 0 0 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  padding-left: 4px;
  font-size: 13px;
  line-height: 1.35;
  color: var(--amanecer);
}
.voice-hint p {
  flex: 1;
  min-width: 0;
  margin: 0;
}
.voice-hint button {
  flex: none;
  min-height: 40px;
  padding: 0 10px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  font: 600 12px/1 var(--f-display);
  letter-spacing: 0.04em;
  color: var(--texto);
}
.composer textarea {
  flex: 1;
  min-width: 0;
  height: 48px;
  min-height: 48px;
  max-height: 132px;
  padding: 12px 14px;
  border: 1px solid var(--linea);
  border-radius: 18px;
  background: var(--panel);
  font: 400 16px/1.4 var(--f-body); /* 16 px: Safari no hace zoom al enfocar */
  resize: none;
}

      line.startsWith("[[") ? line : `- ${line}`,
    ),
    "- Si pide borrar algo, borra solo lo que señaló.",
    "- No guardes contraseñas ni datos delicados como recuerdo; dile por qué.",
  ];
  if (!persistent)
    lines.push(
      `- En esta vista no hay memoria guardada: lo que anotes se pierde al cerrar la página. Avísale a ${USER_NAME} una sola vez si te pide anotar o recordar algo.`,
    );
  return lines.join("\n");
}

const MAX_TURNS = 30;
const MAX_HISTORY_CHARS = 60000;

// Deja las instrucciones al frente y recorta el historial por el lado viejo.
// `turns` termina en el mensaje nuevo del usuario.
function buildInput(instructions, turns) {
  const recent = [];
  let chars = 0;
  for (let i = turns.length - 1; i >= 0 && recent.length < MAX_TURNS; i--) {
    const turn = turns[i];
    if (!turn.content) continue;
    chars += turn.content.length;
    if (chars > MAX_HISTORY_CHARS && recent.length > 0) break;
    recent.unshift({ role: turn.role, content: turn.content });
  }
  return [{ role: "user", content: instructions }, ...recent];
}

// ---- public/markdown.js ----
// Markdown mínimo y seguro para las respuestas de Jarvis.
// Todo el texto del modelo se escapa y solo se generan etiquetas de una lista
// fija, así que nada de lo que escriba puede colarse como HTML ejecutable.
// Tolera texto a medias (un bloque de código sin cerrar) porque se llama en
// cada trozo del streaming.

const ESCAPES = {
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  '"': "&quot;",
  "'": "&#39;",
};

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (ch) => ESCAPES[ch]);
}

// Marcas privadas para apartar código y enlaces mientras se aplican negritas.
const HOLD_OPEN = "\uE000";
const HOLD_CLOSE = "\uE001";
const HOLD = /\uE000(\d+)\uE001/g;
const RESERVED = /[\uE000\uE001]/g;

const INLINE_TOKEN =
  /`([^`\n]+)`|\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<>"'`]+)/g;

function anchor(url, labelHtml) {
  return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${labelHtml}</a>`;
}

// Recibe texto ya escapado.
function emphasis(text) {
  return text
    .replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^\w*])\*(?=\S)([^*\n]*?\S)\*(?![\w*])/g, "$1<em>$2</em>")
    .replace(
      /(^|[^\w_])__(?=\S)([\s\S]*?\S)__(?![\w_])/g,
      "$1<strong>$2</strong>",
    )
    .replace(/(^|[^\w_])_(?=\S)([^_\n]*?\S)_(?![\w_])/g, "$1<em>$2</em>")
    .replace(/~~(?=\S)([\s\S]*?\S)~~/g, "<del>$1</del>");
}

function renderInline(raw) {
  const held = [];
  const hold = (html) => `${HOLD_OPEN}${held.push(html) - 1}${HOLD_CLOSE}`;
  const marked = raw.replace(INLINE_TOKEN, (match, ...groups) => {
    const [code, label, href, bare] = groups;
    if (code !== undefined) return hold(`<code>${escapeHtml(code)}</code>`);
    if (href !== undefined)
      return hold(anchor(href, emphasis(escapeHtml(label))));
    const url = bare.replace(/[.,;:!?)\]]+$/, "");
    return hold(anchor(url, escapeHtml(url))) + bare.slice(url.length);
  });
  return emphasis(escapeHtml(marked)).replace(
    HOLD,
    (_, index) => held[Number(index)],
  );
}

const FENCE_OPEN = /^\s*(`{3,}|~{3,})\s*([^\s`]*)[^`]*$/;
const HEADING = /^\s{0,3}(#{1,6})\s+(.+?)\s*#*\s*$/;
const RULE = /^\s{0,3}([-*_])(?:\s*\1){2,}\s*$/;
const QUOTE = /^\s{0,3}>\s?/;
const LIST_ITEM = /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/;
const TABLE_DIVIDER = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;

function isTableStart(lines, i) {
  return (
    lines[i].includes("|") &&
    i + 1 < lines.length &&
    lines[i + 1].includes("-") &&
    TABLE_DIVIDER.test(lines[i + 1])
  );
}

function startsBlock(lines, i) {
  const line = lines[i];
  return (
    FENCE_OPEN.test(line) ||
    HEADING.test(line) ||
    RULE.test(line) ||
    QUOTE.test(line) ||
    LIST_ITEM.test(line) ||
    isTableStart(lines, i)
  );
}

function codeBlock(lang, code) {
  const label = lang ? escapeHtml(lang) : "código";
  return (
    `<div class="code"><div class="code-head"><span>${label}</span>` +
    `<button type="button" class="code-copy" data-copy>Copiar</button></div>` +
    `<pre><code>${escapeHtml(code)}</code></pre></div>`
  );
}

// Devuelve [html, índiceSiguiente]. Sin cierre, el bloque llega hasta el final.
function readFence(lines, start) {
  const [, marker, lang] = lines[start].match(FENCE_OPEN);
  const close = new RegExp(`^\\s*${marker[0]}{${marker.length},}\\s*$`);
  const indent = lines[start].match(/^\s*/)[0].length;
  const code = [];
  let i = start + 1;
  while (i < lines.length && !close.test(lines[i])) {
    const line = lines[i];
    const lead = line.match(/^\s*/)[0].length;
    code.push(line.slice(Math.min(indent, lead)));
    i++;
  }
  return [codeBlock(lang, code.join("\n")), Math.min(i + 1, lines.length)];
}

// Parte una fila de tabla por "|" y respeta los "\|" escapados. Sin
// "lookbehind" en la expresión regular: en Safari antiguo rompe toda la página.
function splitRow(line) {
  const text = line.trim().replace(/^\|/, "").replace(/\|$/, "");
  const cells = [];
  let cell = "";
  for (let i = 0; i < text.length; i++) {
    if (text[i] === "\\" && text[i + 1] === "|") {
      cell += "|";
      i++;
    } else if (text[i] === "|") {
      cells.push(cell.trim());
      cell = "";
    } else cell += text[i];
  }
  cells.push(cell.trim());
  return cells;
}

function readTable(lines, start) {
  const head = splitRow(lines[start]);
  const rows = [];
  let i = start + 2;
  while (i < lines.length && lines[i].trim() && lines[i].includes("|")) {
    rows.push(splitRow(lines[i]));
    i++;
  }
  const cells = (row, tag) =>
    `<tr>${row.map((cell) => `<${tag}>${renderInline(cell)}</${tag}>`).join("")}</tr>`;
  const html =
    `<div class="table-wrap"><table><thead>${cells(head, "th")}</thead>` +
    `<tbody>${rows.map((row) => cells(row, "td")).join("")}</tbody></table></div>`;
  return [html, i];
}

function readQuote(lines, start) {
  const inner = [];
  let i = start;
  while (i < lines.length && QUOTE.test(lines[i])) {
    inner.push(lines[i].replace(QUOTE, ""));
    i++;
  }
  return [`<blockquote>${renderBlocks(inner)}</blockquote>`, i];
}

function indentOf(line) {
  return line.match(/^\s*/)[0].length;
}

// Junta las líneas de un elemento de lista: su primera línea y lo que venga
// más sangrado (párrafos, sublistas, bloques de código).
function readListItem(lines, start, baseIndent) {
  const [whole, , , content] = lines[start].match(LIST_ITEM);
  const contentIndent = whole.length - content.length;
  const body = [content];
  let i = start + 1;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) {
      const next = lines.slice(i + 1).find((later) => later.trim());
      if (next === undefined || indentOf(next) < baseIndent + 2) break;
      body.push("");
      i++;
      continue;
    }
    const indent = indentOf(line);
    const lazy =
      indent <= baseIndent + 1 && body.at(-1) !== "" && !startsBlock(lines, i);
    if (indent < baseIndent + 2 && !lazy) break;
    body.push(line.slice(Math.min(indent, contentIndent)));
    i++;
  }
  return [body, i];
}

function readList(lines, start) {
  const [, lead, marker] = lines[start].match(LIST_ITEM);
  const baseIndent = lead.length;
  const ordered = /\d/.test(marker);
  const items = [];
  let i = start;
  while (i < lines.length) {
    const item = lines[i].match(LIST_ITEM);
    if (!item || Math.abs(item[1].length - baseIndent) > 1) break;
    if (/\d/.test(item[2]) !== ordered) break;
    const [body, next] = readListItem(lines, i, baseIndent);
    // Un elemento de un solo párrafo va sin <p> para que la lista quede compacta.
    items.push(renderBlocks(body).replace(/^<p>([\s\S]*?)<\/p>/, "$1"));
    i = next;
    while (i < lines.length && !lines[i].trim()) i++;
  }
  const first = Number.parseInt(marker, 10);
  const open = ordered
    ? first > 1
      ? `<ol start="${first}">`
      : "<ol>"
    : "<ul>";
  const html = `${open}${items.map((item) => `<li>${item}</li>`).join("")}</${ordered ? "ol" : "ul"}>`;
  return [html, i];
}

function readParagraph(lines, start) {
  const text = [lines[start].trim()];
  let i = start + 1;
  while (i < lines.length && lines[i].trim() && !startsBlock(lines, i)) {
    text.push(lines[i].trim());
    i++;
  }
  return [`<p>${text.map(renderInline).join("<br>")}</p>`, i];
}

function readBlock(lines, i) {
  const line = lines[i];
  if (FENCE_OPEN.test(line)) return readFence(lines, i);
  const heading = line.match(HEADING);
  if (heading) {
    const tag = heading[1].length <= 2 ? "h3" : "h4";
    return [`<${tag}>${renderInline(heading[2])}</${tag}>`, i + 1];
  }
  if (RULE.test(line)) return ["<hr>", i + 1];
  if (QUOTE.test(line)) return readQuote(lines, i);
  if (isTableStart(lines, i)) return readTable(lines, i);
  if (LIST_ITEM.test(line)) return readList(lines, i);
  return readParagraph(lines, i);
}

function renderBlocks(lines) {
  const out = [];
  let i = 0;
  while (i < lines.length) {
    if (!lines[i].trim()) {
      i++;
      continue;
    }
    const [html, next] = readBlock(lines, i);
    out.push(html);
    i = Math.max(next, i + 1);
  }
  return out.join("");
}

function renderMarkdown(source) {
  const lines = String(source ?? "")
    .replace(RESERVED, "")
    .replace(/\r\n?/g, "\n")
    .split("\n");
  return renderBlocks(lines);
}

// ---- public/store.js ----
// Tareas y memoria de Jarvis.
// - Con la capability `db`: cada tarea y cada recuerdo es un documento bajo
//   data/users/<id>/jarvis/, el subárbol privado de quien abre la página. Se
//   sincroniza en vivo entre dispositivos con onSnapshot.
// - Sin `db`: todo vive en la memoria de la pestaña y se pierde al cerrar.
// Las dos variantes exponen la misma interfaz.

const STORE_LIMITS = {
  taskChars: 280,
  memoryChars: 500,
  tasks: 200,
  memories: 100,
};

// Error con un mensaje que se le puede mostrar a Emilio tal cual.
class StoreError extends Error {}

function cleanText(value, max) {
  return String(value ?? "")
    .replace(/\s+/g, " ")
    .trim()
    .slice(0, max);
}

// Pendientes primero (las más antiguas arriba); hechas al final (la última
// completada arriba).
function sortTasks(tasks) {
  return [...tasks].sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    return a.done
      ? (b.doneAt ?? 0) - (a.doneAt ?? 0)
      : a.createdAt - b.createdAt;
  });
}

function sortMemories(memories) {
  return [...memories].sort((a, b) => a.createdAt - b.createdAt);
}

function newTask(id, text) {
  return { id, text, done: false, createdAt: Date.now(), doneAt: null };
}

function newMemory(id, text) {
  return { id, text, createdAt: Date.now() };
}

function checkRoom(list, limit, what) {
  if (list.length >= limit)
    throw new StoreError(
      `Ya hay ${limit} ${what}. Borra algunos para agregar más.`,
    );
}

function requireText(value, max, what) {
  const text = cleanText(value, max);
  if (!text) throw new StoreError(`Falta el texto ${what}.`);
  return text;
}

let localCounter = 0;
function localId() {
  localCounter += 1;
  return `local-${Date.now().toString(36)}-${localCounter}`;
}

function createSessionStore(onChange = () => {}) {
  let tasks = [];
  let memories = [];
  const changed = () => onChange();
  return {
    persistent: false,
    get sync() {
      return "ok";
    },
    get tasks() {
      return sortTasks(tasks);
    },
    get memories() {
      return sortMemories(memories);
    },
    async addTask(value) {
      const text = requireText(value, STORE_LIMITS.taskChars, "de la tarea");
      checkRoom(tasks, STORE_LIMITS.tasks, "tareas");
      const task = newTask(localId(), text);
      tasks.push(task);
      changed();
      return task;
    },
    async setTaskDone(id, done) {
      const task = tasks.find((item) => item.id === id);
      if (!task) throw new StoreError("Esa tarea ya no existe.");
      task.done = Boolean(done);
      task.doneAt = task.done ? Date.now() : null;
      changed();
      return task;
    },
    async removeTask(id) {
      const task = tasks.find((item) => item.id === id);
      if (!task) throw new StoreError("Esa tarea ya no existe.");
      tasks = tasks.filter((item) => item.id !== id);
      changed();
      return task;
    },
    async restoreTask(task) {
      if (!tasks.some((item) => item.id === task.id)) tasks.push({ ...task });
      changed();
    },
    async addMemory(value) {
      const text = requireText(value, STORE_LIMITS.memoryChars, "del recuerdo");
      checkRoom(memories, STORE_LIMITS.memories, "recuerdos");
      const memory = newMemory(localId(), text);
      memories.push(memory);
      changed();
      return memory;
    },
    async removeMemory(id) {
      const memory = memories.find((item) => item.id === id);
      if (!memory) throw new StoreError("Ese recuerdo ya no existe.");
      memories = memories.filter((item) => item.id !== id);
      changed();
      return memory;
    },
    async restoreMemory(memory) {
      if (!memories.some((item) => item.id === memory.id))
        memories.push({ ...memory });
      changed();
    },
    retry() {},
  };
}

const DB_MESSAGES = {
  quota_exceeded: "La memoria está llena. Borra algo y vuelve a intentarlo.",
  invalid_argument: "Esta vista no tiene permiso para guardar.",
  resource_exhausted: "Demasiados cambios seguidos. Espera un momento.",
  unavailable: "No pude conectar con la memoria. Vuelve a intentarlo.",
};
const DB_GONE = "Se perdió el acceso a la memoria en esta vista.";

function toStoreError(error) {
  if (error instanceof StoreError) return error;
  return new StoreError(DB_MESSAGES[error?.code] ?? DB_GONE);
}

// Lo que llega de la base se valida campo por campo antes de mostrarlo.
function readTask(doc) {
  const data = doc.data() ?? {};
  return {
    id: doc.id,
    text: cleanText(data.text, STORE_LIMITS.taskChars),
    done: data.done === true,
    createdAt: Number(data.createdAt) || 0,
    doneAt: Number(data.doneAt) || null,
  };
}

function readMemory(doc) {
  const data = doc.data() ?? {};
  return {
    id: doc.id,
    text: cleanText(data.text, STORE_LIMITS.memoryChars),
    createdAt: Number(data.createdAt) || 0,
  };
}

const LOAD_LIMIT_MS = 10000;

// Una escritura a la vez por documento (regla de la capability `db`). Un
// fallo `unavailable` es pasajero: se reintenta una sola vez tras una pausa.
function createWriter() {
  const chains = new Map();
  function inOrder(id, operation) {
    const previous = chains.get(id) ?? Promise.resolve();
    const next = previous.catch(() => {}).then(operation);
    chains.set(id, next);
    next
      .catch(() => {})
      .finally(() => {
        if (chains.get(id) === next) chains.delete(id);
      });
    return next;
  }
  return async function write(id, operation) {
    try {
      return await inOrder(id, async () => {
        try {
          return await operation();
        } catch (error) {
          if (error?.code !== "unavailable") throw error;
          await new Promise((done) =>
            setTimeout(done, 400 + Math.random() * 600),
          );
          return operation();
        }
      });
    } catch (error) {
      throw toStoreError(error);
    }
  };
}

// Se suscribe una sola vez a cada colección y mantiene `state` al día.
// `sync` dice cómo va la carga: "loading", "ok", "late" (pasaron 10 s sin
// respuesta) o "error" (el listener murió; `retry` vuelve a suscribirse).
function watchCollections(collections, state, onChange) {
  const keys = Object.keys(collections);
  const confirmed = {};
  let failed = false;
  let late = false;
  let timer = null;
  let unsubscribe = [];
  const allConfirmed = () => keys.every((key) => confirmed[key]);

  function subscribe() {
    for (const key of keys) confirmed[key] = false;
    failed = false;
    late = false;
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (allConfirmed()) return;
      late = true;
      onChange();
    }, LOAD_LIMIT_MS);
    unsubscribe = keys.map((key) =>
      collections[key].ref.onSnapshot(
        (snapshot) => {
          state[key] = snapshot.docs
            .filter((doc) => doc.exists)
            .map(collections[key].read)
            .filter((item) => item.text);
          if (!snapshot.metadata?.fromCache) confirmed[key] = true;
          if (allConfirmed()) clearTimeout(timer);
          onChange();
        },
        () => {
          failed = true;
          clearTimeout(timer);
          onChange();
        },
      ),
    );
  }

  subscribe();
  return {
    get sync() {
      if (failed) return "error";
      if (allConfirmed()) return "ok";
      return late ? "late" : "loading";
    },
    retry() {
      for (const stop of unsubscribe) stop?.();
      subscribe();
      onChange();
    },
  };
}

function createCloudStore(db, userId, onChange = () => {}) {
  const root = db.collection(`data/users/${userId}`).doc("jarvis");
  const collections = {
    tasks: { ref: root.collection("tareas"), read: readTask },
    memories: { ref: root.collection("recuerdos"), read: readMemory },
  };
  const state = { tasks: [], memories: [] };
  const write = createWriter();
  const watch = watchCollections(collections, state, onChange);
  const taskDoc = (id) => collections.tasks.ref.doc(id);
  const memoryDoc = (id) => collections.memories.ref.doc(id);

  function find(key, id, missing) {
    const item = state[key].find((entry) => entry.id === id);
    if (!item) throw new StoreError(missing);
    return item;
  }

  return {
    persistent: true,
    get sync() {
      return watch.sync;
    },
    get tasks() {
      return sortTasks(state.tasks);
    },
    get memories() {
      return sortMemories(state.memories);
    },
    async addTask(value) {
      const text = requireText(value, STORE_LIMITS.taskChars, "de la tarea");
      checkRoom(state.tasks, STORE_LIMITS.tasks, "tareas");
      const ref = collections.tasks.ref.doc();
      const task = newTask(ref.id, text);
      const { id, ...data } = task;
      await write(id, () => ref.set(data));
      return task;
    },
    async setTaskDone(id, done) {
      const task = find("tasks", id, "Esa tarea ya no existe.");
      const patch = { done: Boolean(done), doneAt: done ? Date.now() : null };
      await write(id, () => taskDoc(id).update(patch));
      return { ...task, ...patch };
    },
    async removeTask(id) {
      const task = find("tasks", id, "Esa tarea ya no existe.");
      await write(id, () => taskDoc(id).delete());
      return task;
    },
    async restoreTask(task) {
      const { id, ...data } = task;
      await write(id, () => taskDoc(id).set(data));
    },
    async addMemory(value) {
      const text = requireText(value, STORE_LIMITS.memoryChars, "del recuerdo");
      checkRoom(state.memories, STORE_LIMITS.memories, "recuerdos");
      const ref = collections.memories.ref.doc();
      const memory = newMemory(ref.id, text);
      const { id, ...data } = memory;
      await write(id, () => ref.set(data));
      return memory;
    },
    async removeMemory(id) {
      const memory = find("memories", id, "Ese recuerdo ya no existe.");
      await write(id, () => memoryDoc(id).delete());
      return memory;
    },
    async restoreMemory(memory) {
      const { id, ...data } = memory;
      await write(id, () => memoryDoc(id).set(data));
    },
    retry: () => watch.retry(),
  };
}

// Elige la variante según lo que esta vista permita. Nunca lanza.
async function createStore(onChange) {
  const claude = globalThis.window?.claude;
  if (!claude?.use) return createSessionStore(onChange);
  try {
    const [db, user] = await Promise.all([
      claude.use("db"),
      claude.use("user"),
    ]);
    const userId = db && user ? await user.id() : null;
    if (!userId) return createSessionStore(onChange);
    return createCloudStore(db, userId, onChange);
  } catch {
    return createSessionStore(onChange);
  }
}
