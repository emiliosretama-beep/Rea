const TASK_ORDER =
  /^(?:anota|apunta|agrega|añade|crea)(?:\s+(?:la|una|esta))?(?:\s+tarea)?\s*:?\s+(.+)$/i;
const MEMORY_ORDER =
  /^(?:recuerda|acu[eé]rdate\s+de|guarda)(?:\s+que)?\s*:?\s+(.+)$/i;

// `runner` ejecuta las acciones (ver backend.js). Devuelve el texto a mostrar.
async function demoReply({ mode, text, runner }) {
  const clean = text.trim().replace(/[.!]+$/, "");
  const task = clean.match(TASK_ORDER);
  if (task) {
    await runner.createTask(task[1]);
    return `Anotado, ${USER_NAME}. Lo ves en Tareas.`;
  }
  const memory = clean.match(MEMORY_ORDER);
  if (memory) {
    await runner.remember(memory[1]);
    return `Listo, lo guardé en Memoria.`;
  }
  return (DEMO_REPLIES[mode] ?? DEMO_REPLIES.general)
    .join("\n\n")
    .replace(/\n\n- /g, "\n- ");
}

// ---- public/backend.js ----
// De dónde sale la IA de Jarvis. Dos modos con la misma interfaz:
// - "cloud": la página está publicada en claude.ai y usa la cuenta de Claude
//   de quien la abre (capability `sample`), sin API key.
// - "demo": esta vista no puede usar Claude; respuestas fijas.
//
// Jarvis actúa sobre tareas y recuerdos de dos maneras:
// - "tools": herramientas de `sample` (si `limits().tools` lo permite).
// - "markers": órdenes de texto tipo [[tarea: ...]] que la página interpreta.


const ASK_ERRORS = {
  not_granted:
    "No diste permiso para usar Claude. Recarga la página y acéptalo para hablar conmigo.",
  sampling_disabled: "Claude no está disponible en esta cuenta.",
  rate_limited:
    "Llegaste al límite de uso por ahora. Espera un poco y vuelve a intentarlo.",
  session_expired: "Tu sesión caducó. Vuelve a iniciar sesión en Claude.",
  prompt_too_large: "La conversación ya es demasiado larga. Empieza una nueva.",
  refused: "No puedo responder a eso. Prueba a pedirlo de otra forma.",
  empty_completion: "No llegó respuesta. Pídelo de otra forma.",
  tools_unavailable:
    "Esta vista no deja usar herramientas. Vuelve a enviar tu mensaje.",
};
const ASK_FALLBACK = "Se cortó la conexión con Claude. Vuelve a intentarlo.";

// Errores que significan "esta vista no puede usar Claude": se pasa a demo.
const ASK_GONE = new Set([
  "not_granted",
  "sampling_disabled",
  "not_declared",
  "capability_disabled",
  "capability_removed",
]);

// Error con un mensaje para Emilio. `partial` es el texto que puede quedarse
// en pantalla; `cancelled` indica que él mismo detuvo la respuesta.
class AskError extends Error {
  constructor(message, { code = "", partial, cancelled = false } = {}) {
    super(message);
    this.code = code;
    this.partial = partial;
    this.cancelled = cancelled;
  }
}

// Ejecuta las acciones de Jarvis, vengan de una herramienta, de un marcador o
// del modo demo. Claude nombra tareas y recuerdos por el número con el que
// aparecen en sus instrucciones; `listed` conserva esa numeración.
function createRunner({ actions, tasks, memories, onAction }) {
  const listed = {
    tasks: tasks.map((task) => ({ ...task })),
    memories: memories.map((memory) => ({ ...memory })),
  };
  let count = 0;
  const report = (action) => {
    count += 1;
    onAction?.(action);
  };
  const pick = (list, number, what) => {
    const item = list[Number.parseInt(number, 10) - 1];
    if (!item)
      throw new Error(
        `No existe ${what} número ${number}. Hay ${list.length}.`,
      );
    if (item.removed) throw new Error(`Ya se borró ${what} número ${number}.`);
    return item;
  };
  return {
    get count() {
      return count;
    },
    async createTask(text) {
      const task = await actions.addTask(text);
      listed.tasks.push({ ...task });
      report({ label: `Tarea creada: ${task.text}` });
      return `Tarea ${listed.tasks.length} creada: ${task.text}`;
    },
    async completeTask(number, done = true) {
      const task = pick(listed.tasks, number, "la tarea");
      await actions.setTaskDone(task.id, done);
      task.done = done;
      report({
        label: `${done ? "Tarea hecha" : "Tarea pendiente otra vez"}: ${task.text}`,
      });
      return `Tarea ${number} marcada como ${done ? "hecha" : "pendiente"}.`;
    },
    async deleteTask(number) {
      const task = pick(listed.tasks, number, "la tarea");
      const removed = await actions.removeTask(task.id);
      task.removed = true;
      report({
        label: `Tarea borrada: ${task.text}`,
        undo: { kind: "task", item: removed },
      });
      return `Tarea ${number} borrada.`;
    },
    async remember(text) {
      const memory = await actions.addMemory(text);
      listed.memories.push({ ...memory });
      report({ label: `Recuerdo guardado: ${memory.text}` });
      return `Guardado como recuerdo ${listed.memories.length}.`;
    },
    async forget(number) {
      const memory = pick(listed.memories, number, "el recuerdo");
      const removed = await actions.removeMemory(memory.id);
      memory.removed = true;
      report({
        label: `Recuerdo borrado: ${memory.text}`,
        undo: { kind: "memory", item: removed },
      });
      return `Recuerdo ${number} borrado.`;
    },
  };
}

const NUMBER_ARG = (what) => ({
  type: "object",
  properties: {
    numero: {
      type: "integer",
      description: `Número ${what} en la lista de las instrucciones.`,
    },
  },
  required: ["numero"],
});

// Herramientas que Claude puede llamar. Lo que devuelven (o el error que
// lanzan) vuelve a Claude como resultado.
function makeTools(runner) {
  const guarded = (run) => async (input, context) => {
    if (context?.signal?.aborted) throw new Error("Cancelado.");
    return run(input ?? {});
  };
  return [
    {
      name: "crear_tarea",
      description:
        "Agrega una tarea a la lista de Emilio y devuelve el número que le tocó. Úsala cuando pida anotar algo por hacer.",
      inputSchema: {
        type: "object",
        properties: {
          texto: {
            type: "string",
            description: "La tarea en una línea, empezando con verbo.",
          },
        },
        required: ["texto"],
      },
      execute: guarded(({ texto }) => runner.createTask(String(texto ?? ""))),
    },
    {
      name: "completar_tarea",
      description:
        "Marca una tarea como hecha, o la regresa a pendiente con hecha=false. Devuelve una confirmación.",
      inputSchema: {
        type: "object",
        properties: {
          numero: {
            type: "integer",
            description: "Número de la tarea en la lista.",
          },
          hecha: {
            type: "boolean",
            description: "true (por defecto) o false para pendiente.",
          },
        },
        required: ["numero"],
      },
      execute: guarded(({ numero, hecha }) =>
        runner.completeTask(numero, hecha !== false),
      ),
    },
    {
      name: "borrar_tarea",
      description:
        "Borra una tarea de la lista. Úsala solo si Emilio pidió borrarla.",
      inputSchema: NUMBER_ARG("de la tarea"),
      execute: guarded(({ numero }) => runner.deleteTask(numero)),
    },
    {
      name: "recordar",
      description:
        "Guarda un dato que Emilio pidió recordar entre conversaciones y devuelve su número.",
      inputSchema: {
        type: "object",
        properties: {
          dato: {
            type: "string",
            description: "El dato, en una frase que se entienda sola.",
          },
        },
        required: ["dato"],
      },
      execute: guarded(({ dato }) => runner.remember(String(dato ?? ""))),
    },
    {
      name: "olvidar",
      description:
        "Borra un recuerdo guardado. Úsala solo si Emilio pidió olvidarlo.",
      inputSchema: NUMBER_ARG("del recuerdo"),
      execute: guarded(({ numero }) => runner.forget(numero)),
    },
  ];
}

const MARKER =
  /\[\[\s*(tarea|hecha|borrar|recuerda|olvida)\s*:\s*([^\]\n]+?)\s*\]\]/gi;

// Separa las órdenes [[...]] del texto que ve Emilio. También esconde una
// orden a medio escribir, porque se llama en cada trozo del streaming.
function splitMarkers(text) {
  const commands = [];
  const visible = text
    .replace(MARKER, (_, kind, value) => {
      commands.push({ kind: kind.toLowerCase(), value });
      return "";
    })
    .replace(/\[\[[^\]\n]*$/, "")
    .replace(/[ \t]+\n/g, "\n")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
  return { visible, commands };
}

const MARKER_RUN = {
  tarea: (runner, value) => runner.createTask(value),
  hecha: (runner, value) => runner.completeTask(value, true),
  borrar: (runner, value) => runner.deleteTask(value),
  recuerda: (runner, value) => runner.remember(value),
  olvida: (runner, value) => runner.forget(value),
};

async function runMarkers(commands, runner, onAction) {
  for (const { kind, value } of commands) {
    try {
      await MARKER_RUN[kind](runner, value);
    } catch (error) {
      onAction?.({ label: `No se pudo: ${error.message}`, failed: true });
    }
  }
}

async function typeOut(text, { signal, onText }) {
  const step = 5;
  for (let end = step; end < text.length + step; end += step) {
    if (signal?.aborted)
      throw new AskError("Detenido.", {
        cancelled: true,
        partial: text.slice(0, end - step),
      });
    onText(text.slice(0, end));
    await new Promise((done) => setTimeout(done, 22));
  }
}

function demoBackend() {
  return {
    mode: "demo",
    acts: "demo",
    async ask({
      mode,
      turns,
      tasks,
      memories,
      actions,
      signal,
      onText,
      onAction,
    }) {
      const runner = createRunner({ actions, tasks, memories, onAction });
      await new Promise((done) => setTimeout(done, 450));
      if (signal?.aborted) throw new AskError("Detenido.", { cancelled: true });
      let text;
      try {
        text = await demoReply({
          mode,
          text: turns.at(-1)?.content ?? "",
          runner,
        });
      } catch (error) {
        throw new AskError(error.message);
      }
      await typeOut(text, { signal, onText });
      return { text, truncated: false };
    },
  };
}

const TOOL_COUNT = 5;

function cloudBackend(sample, limits, onGone) {
  let acts = (limits?.tools?.maxCount ?? 0) >= TOOL_COUNT ? "tools" : "markers";
  const tiers = limits?.modelTiers;
  const shown = (text) =>
    acts === "markers" ? splitMarkers(text).visible : text;

  return {
    mode: "cloud",
    get acts() {
      return acts;
    },
    async ask({
      mode,
      turns,
      tasks,
      memories,
      persistent,
      spoken,
      actions,
      signal,
      onText,
      onAction,
    }) {
      const runner = createRunner({ actions, tasks, memories, onAction });
      const instructions = buildInstructions({
        mode,
        tasks,
        memories,
        persistent,
        spoken,
        now: new Date(),
        actMode: acts,
      });
      const tier = MODES[mode]?.tier;
      const options = {
        signal,
        cache: false,
        onText: ({ text }) => onText(shown(text)),
        ...(tier && (!tiers || tiers.includes(tier)) && { modelTier: tier }),
        ...(acts === "tools" && { tools: makeTools(runner) }),
      };
      try {
        const { text, truncated } = await sample(
          buildInput(instructions, turns),
          options,
        );
        if (acts !== "markers") return { text, truncated };
        const { visible, commands } = splitMarkers(text);
        await runMarkers(commands, runner, onAction);
        return { text: visible || "Listo.", truncated };
      } catch (error) {
        const code = error?.code ?? "";
        const partial =
          typeof error?.text === "string" ? shown(error.text) : undefined;
        if (code === "cancelled")
          throw new AskError("Detenido.", { cancelled: true, partial });
        // Claude usó herramientas pero no escribió nada: lo hecho, hecho está.
        if (code === "empty_completion" && runner.count > 0)
          return { text: "Listo.", truncated: false };
        if (code === "tools_unavailable") acts = "markers";
        if (ASK_GONE.has(code)) onGone();
        throw new AskError(ASK_ERRORS[code] ?? ASK_FALLBACK, { code, partial });
      }
    },
  };
}

// Nunca lanza. `onGone(demo)` avisa cuando la vista deja de poder usar Claude.
async function createBackend({ onGone } = {}) {
  const claude = globalThis.window?.claude;
  const demo = demoBackend();
  if (!claude?.use) return demo;
  const sample = await claude.use("sample").catch(() => null);
  if (!sample) return demo;
  // limits() falta en visores antiguos: sin límites conocidos no se usan tools.
  const limits = await Promise.resolve()
    .then(() => sample.limits())
    .catch(() => null);
  return cloudBackend(sample, limits, () => onGone?.(demo));
}

// ---- public/voice.js ----
// Voz de Jarvis: hablarle y escucharlo.
// - Hablarle: la capability `dictation` (el micrófono lo abre la plataforma).
//   En Safari y en las apps móviles no existe; ahí talk.js usa el dictado del
//   teclado.
// - Escucharlo: la voz del propio navegador (speechSynthesis), con el mismo
//   sistema que el copiloto de Born to Rally: se puntúan las voces del
//   dispositivo para elegir la mejor en español (de hombre y de alta calidad
//   si las hay), y se puede cambiar a mano, probarla y ajustar su volumen.

const CHUNK_LIMIT = 240; // frases cortas: la voz arranca antes y no se corta
const START_LIMIT_MS = 3000;
const SENTENCE_END = ".!?…:";
const VOICE_KEY = "jarvis:voice:v1";
const RATE = 1.1; // el copiloto canta notas a 1.28; para conversar, más calmado
const PITCH = 0.9; // igual que el copiloto
const SAMPLE = "Hola, Emilio. Soy Jarvis, y así voy a sonar.";

// Markdown a texto que se pueda decir: sin símbolos, sin código y con los
// enlaces por su nombre. Un bloque de código sin cerrar (streaming) se calla
// hasta el final, así lo ya dicho no cambia cuando llega más texto.
function speechText(markdown) {
  return String(markdown ?? "")
    .replace(/```[\s\S]*?(?:```|$)/g, "\n(bloque de código)\n")
    .replace(/`([^`\n]+)`/g, "$1")
    .replace(/\[([^\]\n]+)\]\(https?:\/\/[^\s)]*\)?/g, "$1")
    .replace(/https?:\/\/\S+/g, "enlace")
    .replace(/^\s*\|?[\s:|-]{3,}\|?\s*$/gm, "")
    .replace(/^\s{0,3}#{1,6}\s+/gm, "")
    .replace(/^\s*>\s?/gm, "")
    .replace(/^\s*[-*+]\s+/gm, "")
    .replace(/(\d)\s*\*\s*(\d)/g, "$1 por $2")
    .replace(/\|/g, ", ")
    .replace(/[*_~]+/g, "")
    .replace(/[ \t]+/g, " ")
    .trim();
}

// Corta una frase larga por una coma o un espacio cercano al límite.
function splitLong(piece) {
  const parts = [];
  let rest = piece;
  while (rest.length > CHUNK_LIMIT) {
    const comma = rest.lastIndexOf(", ", CHUNK_LIMIT);
    const space = rest.lastIndexOf(" ", CHUNK_LIMIT);
    let cut = CHUNK_LIMIT;
    if (comma > CHUNK_LIMIT / 2) cut = comma + 1;
    else if (space > 0) cut = space;
    parts.push(rest.slice(0, cut).trim());
    rest = rest.slice(cut).trim();
  }
  if (rest) parts.push(rest);
  return parts;
}

// Frases para decir. Con `done` en false (streaming) la última frase se guarda
// hasta que llegue completa.
function speechChunks(markdown, done = true) {
  const plain = speechText(markdown);
  const pieces = [];
  let start = 0;
  for (let i = 0; i < plain.length; i++) {
    const char = plain[i];
    const closes = SENTENCE_END.includes(char) && /\s/.test(plain[i + 1] ?? "");
    if (char !== "\n" && !closes) continue;
    pieces.push(plain.slice(start, i + 1));
    start = i + 1;
  }
  if (done) pieces.push(plain.slice(start));
  return pieces
    .map((piece) => piece.trim())
    .filter((piece) => /[\p{L}\p{N}]/u.test(piece))
    .flatMap(splitLong);
}

// ---------- Elegir la voz (sistema del copiloto de Born to Rally) ----------

// Nombres con los que los sistemas llaman a sus voces de hombre.
const MALE_VOICES = new Set(
  (
    "jorge pablo alvaro álvaro diego enrique carlos raul raúl jordi dario darío " +
    "jose josé arnau juan gerardo elias elías saul saúl teo andres andrés daniel " +
    "oliver george ryan guy thomas arthur christopher eric roger andrew brian " +
    "steffan aaron alex tom lee reed eddy rocko male hombre masculino masculina"
  ).split(" "),
);

// Voces de broma que traen iPhone, iPad y Mac: no sirven para un asistente.
const JOKE_VOICES = new Set(
  (
    "albert bahh bells campanas boing bubbles burbujas cellos chelos violonchelos " +
    "deranged trastornado hysterical histérico histerico organ pipeorgan órgano " +
    "organo princess princesa trinoids trinoides whisper susurro zarvox fred " +
    "junior kathy ralph jester bufón bufon superstar superestrella wobble " +
    "bamboleo news goodnews badnews noticias grandma grandpa abuela abuelo espeak"
  ).split(" "),
);

const HIGH_QUALITY =
  /natural|neural|online|premium|enhanced|mejorad|wavenet|studio/i;

const voiceName = (voice) => `${voice.name ?? ""} ${voice.voiceURI ?? ""}`;
const voiceWords = (voice) =>
  voiceName(voice)
    .toLowerCase()
    .split(/[^a-záéíóúñü]+/);
const isJokeVoice = (voice) =>
  voiceWords(voice).some((word) => JOKE_VOICES.has(word));
const isMaleVoice = (voice) =>
  voiceWords(voice).some((word) => MALE_VOICES.has(word));

// Preferencia: acento de España, voces de alta calidad y de hombre; las voces
// antiguas y robóticas, al final. Son los mismos pesos que usa el copiloto.
function scoreVoice(voice) {
  const name = voiceName(voice);
  let score = 0;
  if (/^es[-_]ES/i.test(voice.lang)) score += 40;
  else if (/^es[-_](MX|US|419)/i.test(voice.lang)) score += 12;
  if (HIGH_QUALITY.test(name)) score += 25;
  if (/google/i.test(name)) score += 12;
  if (isMaleVoice(voice)) score += 22;
  if (/eloquence/i.test(name)) score -= 20;
  if (voice.default) score += 3;
  return score;
}

// Las voces en español del dispositivo, de la mejor a la peor y sin repetir.
function rankVoices(voices) {
  const seen = new Set();
  return voices
    .filter((voice) => /^es/i.test(voice.lang ?? "") && !isJokeVoice(voice))
    .sort((a, b) => scoreVoice(b) - scoreVoice(a))
    .filter((voice) => !seen.has(voice.name) && seen.add(voice.name));
}

// Nombre corto para el selector: "Jorge · ES ♂ ★".
function voiceLabel(voice) {
  const name =
    (voice.name ?? "")
      .replace(/^(Microsoft|Google|Apple)\s+/i, "")
      .replace(/\s+-\s+.*$/, "")
      .replace(/\s*\((?:[^()]|\([^()]*\))*\)\s*$/, "")
      .replace(/\s+online/i, "")
      .trim() || voice.lang;
  const region = (voice.lang ?? "").split(/[-_]/)[1] ?? "";
  return (
    name +
    (region ? ` · ${region.toUpperCase()}` : "") +
    (isMaleVoice(voice) ? " ♂" : "") +
    (HIGH_QUALITY.test(voiceName(voice)) ? " ★" : "")
  );
}

// La voz elegida y su volumen se recuerdan en este dispositivo: cada aparato
// tiene sus propias voces.
function loadSettings() {
  const settings = { name: "", volume: 1, muted: false };
  try {
    const saved = JSON.parse(localStorage.getItem(VOICE_KEY) ?? "null") ?? {};
    if (typeof saved.name === "string") settings.name = saved.name;
    if (Number.isFinite(saved.volume))
      settings.volume = Math.min(1, Math.max(0, saved.volume));
    settings.muted = saved.muted === true;
  } catch {
    // Sin almacenamiento: se usan los valores de fábrica.
  }
  return settings;
}

function saveSettings(settings) {
  try {
    localStorage.setItem(VOICE_KEY, JSON.stringify(settings));
  } catch {
    // Si no se puede guardar, el ajuste vale solo para esta visita.
  }
}

// ---------- Hablar ----------

// Lee en voz alta, frase por frase. `pick()` da la voz a usar y `settings` el
// volumen. Avisa de su estado con handlers.onSpeechState.
function createReader(synth, handlers, pick, settings) {
  let session = null; // { id, queued, pending, closed, started, watchdog, poll, keep }

  function end(mine) {
    clearTimeout(mine.watchdog);
    clearInterval(mine.poll);
    if (session !== mine) return;
    session = null;
    handlers.onSpeechState?.("idle", null);
  }

  function stop() {
    if (!session) return;
    end(session);
    synth.cancel();
  }

  function say(mine, chunk) {
    const utterance = new SpeechSynthesisUtterance(chunk);
    const voice = pick();
    if (voice) utterance.voice = voice;
    utterance.lang = voice?.lang ?? "es-ES";
    utterance.rate = RATE;
    utterance.pitch = PITCH;
    utterance.volume = settings.volume;
    utterance.onstart = () => {
      if (session !== mine || mine.started) return;
      mine.started = true;
      clearTimeout(mine.watchdog);
      handlers.onSpeechState?.("speaking", mine.id);
    };
    const settle = () => {
      mine.pending -= 1;
      if (mine.closed && mine.pending <= 0) end(mine);
    };
    utterance.onend = settle;
    utterance.onerror = settle;
    mine.keep.push(utterance); // sin referencia, el navegador puede perder "end"
    mine.pending += 1;
    try {
      synth.resume(); // como el copiloto: por si la voz quedó en pausa
    } catch {
      // No todos los navegadores lo tienen.
    }
    synth.speak(utterance);
  }

  // Dos vigilancias: que la voz arranque (Safari exige un toque previo) y que
  // no se quede "hablando" para siempre si el navegador pierde el evento final.
  function watch(mine) {
    if (mine.watchdog) return;
    handlers.onSpeechState?.("starting", mine.id);
    mine.watchdog = setTimeout(() => {
      if (session !== mine || mine.started) return;
      stop();
      handlers.onNotice?.(
        "El navegador no dejó que Jarvis hablara solo. Toca «Escuchar» en la respuesta.",
      );
    }, START_LIMIT_MS);
    let quiet = 0;
    mine.poll = setInterval(() => {
      const silent =
        mine.started && mine.closed && !synth.speaking && !synth.pending;
      quiet = silent ? quiet + 1 : 0;
      if (quiet >= 2) end(mine);
    }, 700);
  }

  function begin(id) {
    stop();
    session = {
      id,
      queued: 0,
      pending: 0,
      closed: false,
      started: false,
      watchdog: null,
      poll: null,
      keep: [],
    };
  }

  function feed(id, text, done) {
    const mine = session;
    if (!mine || mine.id !== id) return;
    const chunks = speechChunks(text, done);
    for (const chunk of chunks.slice(mine.queued)) say(mine, chunk);
    if (chunks.length > mine.queued) watch(mine);
    mine.queued = Math.max(mine.queued, chunks.length);
    if (!done) return;
    mine.closed = true;
    if (mine.pending <= 0) end(mine);
  }

  return {
    begin,
    feed,
    stop,
    // Lee una respuesta entera, o calla si ya suena.
    toggle(id, text) {
      if (session?.id === id) return stop();
      begin(id);
      feed(id, text, true);
    },
    // Dice una frase suelta.
    say(text) {
      begin("frase");
      feed("frase", text, true);
    },
  };
}

// Lo que expone la voz:
//   unlock()              llamar dentro de un toque: Safari solo deja hablar
//                         después de uno
//   begin(id)             empieza a leer la respuesta `id`
//   feed(id, text, done)  texto acumulado de la respuesta; `done` al terminar
//   toggle(id, text)      lee una respuesta entera, o calla si ya suena
//   say(text) / test()    dice una frase suelta / la frase de prueba
//   stop()
//   voices(), settings, setVoice(), setVolume(), setMuted(), onVoices()
function setupSpeech(synth, handlers) {
  const settings = loadSettings();
  let primed = false;
  let voicesChanged = null;

  function ranked() {
    try {
      return rankVoices(synth.getVoices() ?? []);
    } catch {
      return [];
    }
  }
  // La voz elegida a mano si sigue en el dispositivo; si no, la mejor puntuada.
  function pick() {
    const list = ranked();
    return (
      list.find((voice) => voice.name === settings.name) ?? list[0] ?? null
    );
  }
  const reader = createReader(synth, handlers, pick, settings);

  const notify = () => voicesChanged?.();
  if (synth.addEventListener) synth.addEventListener("voiceschanged", notify);
  else synth.onvoiceschanged = notify;

  return {
    ...reader,
    unlock() {
      if (primed) return;
      primed = true;
      try {
        const silent = new SpeechSynthesisUtterance(" ");
        silent.volume = 0;
        synth.speak(silent);
      } catch {
        // Sin voz en este navegador: los botones de escuchar no harán nada.
      }
    },
    test: () => reader.say(SAMPLE),
    voices: () =>
      ranked().map((voice) => ({ name: voice.name, label: voiceLabel(voice) })),
    get settings() {
      return { ...settings };
    },
    setVoice(name) {
      settings.name = name;
      saveSettings(settings);
    },
    setVolume(volume) {
      settings.volume = Math.min(1, Math.max(0, volume));
      saveSettings(settings);
    },
    setMuted(muted) {
      settings.muted = muted;
      saveSettings(settings);
    },
    // El dispositivo carga sus voces con retraso: avisa cuando ya están.
    onVoices(callback) {
      voicesChanged = callback;
    },
  };
}

// ---------- Escuchar (micrófono de la plataforma) ----------

const DICTATION_NOTES = {
  rate_limited: "Hay demasiados dictados a la vez. Intenta en un momento.",
  upstream_error: "Falló el micrófono o el servicio de voz.",
  not_granted: "El dictado está desactivado para esta página.",
};

function setupDictation(dictation, handlers) {
  // Se pide español; si no se ofrece, el siguiente intento usa el idioma del
  // dispositivo, y si tampoco, el micrófono de la plataforma se da por perdido.
  let language = "es";
  let listened = false;
  const drop = () => handlers.onDictationGone?.();

  dictation.onPartial(({ text }) => handlers.onPartial?.(text));
  dictation.onFinal(({ text }) => handlers.onFinal?.(text));
  dictation.onState(({ state, reason }) => {
    handlers.onDictationState?.(state);
    if (state === "listening") listened = true;
    if (state !== "idle") return;
    // Un arranque fallido lo atiende fail(); aquí solo lo que corta un dictado
    // que ya estaba escuchando.
    if (reason === "not_granted" || (listened && reason === "unavailable"))
      drop();
    listened = false;
  });

  function fail(error) {
    const code = error?.code;
    if (code === "unavailable" && language) {
      language = null;
      handlers.onNotice?.(
        "No hay dictado en español aquí. Toca otra vez para usar el idioma de tu dispositivo.",
      );
    } else if (code === "unavailable" || code === "not_granted") {
      handlers.onNotice?.(DICTATION_NOTES.not_granted);
      drop();
    } else if (DICTATION_NOTES[code])
      handlers.onNotice?.(DICTATION_NOTES[code]);
  }

  return {
    // Debe llamarse directo desde el clic: start() exige el gesto del usuario.
    toggle() {
      if (dictation.active()) {
        dictation.stop().catch(() => {});
        return;
      }
      dictation.start(language ? { language } : undefined).catch(fail);
    },
    stop: () => dictation.stop().catch(() => {}),
  };
}

// Nunca lanza. `listen` es null si la vista no ofrece micrófono; `speech` es
// null si el navegador no tiene voz.
async function createVoice(handlers = {}) {
  const claude = globalThis.window?.claude;
  const dictation = claude?.use
    ? await claude.use("dictation").catch(() => null)
    : null;
  const synth = globalThis.speechSynthesis;
  const canSpeak = Boolean(synth && globalThis.SpeechSynthesisUtterance);
  return {
    listen: dictation ? setupDictation(dictation, handlers) : null,
    speech: canSpeak ? setupSpeech(synth, handlers) : null,
  };
}

// ---- public/core.js ----
// El núcleo: el sol de ERA (el disco con la "E" del logo) rodeado de un anillo
// de marcas y dos arcos. Es el único efecto animado de la página y cambia con
// lo que hace Jarvis: reposo, escuchando, pensando o hablando.
// Cada capa es un <svg> aparte para animar solo transform y opacity.

const TAU = 2 * Math.PI;

// Trazo punteado que reparte `count` marcas exactas en un círculo de radio `r`.
function ticks(r, count, length) {
  const period = (TAU * r) / count;
  return `${length} ${(period - length).toFixed(4)}`;
}

// Recortes que dibujan la "E" sobre el disco, con las proporciones del logo.
const SUN_CUTS = [
  { x: 100, y: 83.4, width: 40, height: 9.7 },
  { x: 100, y: 106.9, width: 40, height: 9.7 },
  { x: 126.8, y: 92.2, width: 14, height: 15.6 },
];

const layer = (name, body) =>
  `<svg class="core-layer ${name}" viewBox="0 0 200 200" focusable="false">${body}</svg>`;

// `variant`: "hero" (grande, pantalla vacía) o "mini" (encabezado).
function coreMarkup(variant) {
  const id = `core-${variant}`;
  const cuts = SUN_CUTS.map(
    (cut) =>
      `<rect x="${cut.x}" y="${cut.y}" width="${cut.width}" height="${cut.height}" fill="#000"/>`,
  ).join("");
  return (
    `<div class="core core--${variant}" aria-hidden="true">` +
    `<span class="core-glow"></span>` +
    layer("core-ring", `<circle cx="100" cy="100" r="78"/>`) +
    layer(
      "core-ticks",
      `<circle class="tick-minor" cx="100" cy="100" r="66" stroke-dasharray="${ticks(66, 72, 1.3)}"/>` +
        `<circle class="tick-major" cx="100" cy="100" r="64" stroke-dasharray="${ticks(64, 12, 1.8)}"/>`,
    ) +
    layer(
      "core-arc core-arc--a",
      `<circle cx="100" cy="100" r="88" stroke-dasharray="120 ${(TAU * 88 - 120).toFixed(3)}"/>`,
    ) +
    layer(
      "core-arc core-arc--b",
      `<circle cx="100" cy="100" r="95" stroke-dasharray="46 ${((TAU * 95) / 2 - 46).toFixed(3)}"/>`,
    ) +
    layer(
      "core-sun",
      `<defs><linearGradient id="${id}-fill" x1="0" y1="0" x2="0" y2="1">` +
        `<stop offset="0" class="sun-top"/><stop offset="1" class="sun-bottom"/></linearGradient>` +
        `<mask id="${id}-cut"><rect width="200" height="200" fill="#fff"/>${cuts}</mask></defs>` +
        `<circle cx="100" cy="100" r="38" fill="url(#${id}-fill)" mask="url(#${id}-cut)"/>`,
    ) +
    `</div>`
  );
}

// Cuántas veces más rápido giran los arcos en cada estado.
const ARC_RATE = { idle: 1, listening: 3, thinking: 14, speaking: 2 };
const KICK_GAP_MS = 140;

function reducedMotion() {
  return (
    globalThis.matchMedia?.("(prefers-reduced-motion: reduce)").matches ?? false
  );
}

// `root` lleva data-core="<estado>" y la variable --energy (0 a 1); el CSS
// hace el resto. Los dos núcleos de la página reaccionan a la vez.
function createCore(root) {
  let state = "idle";
  let calm = null;
  let talker = null;
  let lastKick = 0;

  // updatePlaybackRate cambia la velocidad sin que el arco salte de ángulo.
  function applyRate() {
    const rate = ARC_RATE[state] ?? 1;
    for (const arc of root.querySelectorAll(".core-arc")) {
      for (const animation of arc.getAnimations?.() ?? []) {
        if (animation.updatePlaybackRate) animation.updatePlaybackRate(rate);
        else animation.playbackRate = rate;
      }
    }
  }

  // Un empujón de energía: las marcas se abren y vuelven. `amount` es cuánto
  // texto acaba de llegar.
  function kick(amount = 12) {
    if (state !== "speaking" || reducedMotion()) return;
    const now = Date.now();
    if (now - lastKick < KICK_GAP_MS) return;
    lastKick = now;
    root.style.setProperty(
      "--energy",
      Math.min(1, 0.4 + amount / 60).toFixed(2),
    );
    clearTimeout(calm);
    calm = setTimeout(() => root.style.setProperty("--energy", "0"), 170);
  }

  return {
    get state() {
      return state;
    },
    set(next) {
      if (next === state) return;
      state = next;
      root.dataset.core = next;
      if (next !== "speaking") root.style.setProperty("--energy", "0");
      applyRate();
    },
    kick,
    // Mientras Jarvis habla en voz alta (sin trozos de texto): pulsos sueltos.
    talk(on) {
      clearInterval(talker);
      talker = on ? setInterval(() => kick(6 + Math.random() * 40), 230) : null;
    },
    // Tras mostrar u ocultar un núcleo sus animaciones se crean de nuevo.
    refresh() {
      requestAnimationFrame(applyRate);
    },
  };
}

// Vuela el núcleo grande hasta el sitio del chico (el momento en que arranca
// la conversación). `hero` sigue visible mientras dura; resuelve al terminar.
function dockCore(hero, mini) {
  const from = hero.getBoundingClientRect();
  const to = mini.getBoundingClientRect();
  if (reducedMotion() || !hero.animate || !from.width || !to.width)
    return Promise.resolve();
  const scale = to.width / from.width;
  const move = `translate(${to.left - from.left}px, ${to.top - from.top}px) scale(${scale})`;
  const flight = hero.animate([{ transform: "none" }, { transform: move }], {
    duration: 620,
    easing: "cubic-bezier(0.2, 0.8, 0.2, 1)",
    fill: "forwards",
  });
  return flight.finished.catch(() => {}).then(() => flight.cancel());
}

// ---- public/ui.js ----
// Utilidades de interfaz compartidas: crear nodos, iconos, avisos y copiar.

const $ = (selector, root = document) => root.querySelector(selector);

// el("li", { class: "x", text: "hola", "data-id": 3 }, hijo1, hijo2)
// `text` se asigna con textContent; `html` solo recibe marcado propio.
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attrs)) {
    if (value === undefined || value === null || value === false) continue;
    if (name === "text") node.textContent = value;
    else if (name === "html") node.innerHTML = value;
    else node.setAttribute(name, value === true ? "" : value);
  }
  node.append(
    ...children.filter((child) => child !== null && child !== undefined),
  );
  return node;
}

// Iconos de trazo fino, 24×24, del color del texto.
const ICONS = {
  tasks:
    '<path d="M4 6.6l1.7 1.7L8.8 5"/><path d="M12 7h8"/><path d="M4 13.6l1.7 1.7 3.1-3.3"/><path d="M12 14h8"/><circle cx="6.3" cy="20" r="1.3"/><path d="M12 20h8"/>',
  memory:
    '<rect x="7" y="7" width="10" height="10" rx="2"/><path d="M10 3.5V7M14 3.5V7M10 17v3.5M14 17v3.5M3.5 10H7M3.5 14H7M17 10h3.5M17 14h3.5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  send: '<path d="M12 19V6"/><path d="M6 11.5l6-6 6 6"/>',
  stop: '<rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
};

function icon(name) {
  return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${ICONS[name]}</svg>`;
}

// Aviso breve abajo de la pantalla, con una acción opcional (p. ej. Deshacer).
function createToast(node) {
  let timer = null;
  const hide = () => {
    clearTimeout(timer);
    node.hidden = true;
  };
  return {
    show(message, { action, onAction, duration = action ? 7000 : 4000 } = {}) {
      node.replaceChildren(el("span", { text: message }));
      if (action) {
        const button = el("button", { type: "button", text: action });
        button.addEventListener("click", () => {
          hide();
          onAction?.();
        });
        node.append(button);
      }
      node.hidden = false;
      clearTimeout(timer);
      timer = setTimeout(hide, duration);
    },
    hide,
  };
}

// El portapapeles solo responde dentro de un clic y puede negarse.
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    return false;
  }
}

// Plan B de "Copiar": deja el texto seleccionado para copiarlo a mano.
function selectContents(node) {
  const selection = globalThis.getSelection?.();
  if (!selection) return;
  const range = document.createRange();
  range.selectNodeContents(node);
  selection.removeAllRanges();
  selection.addRange(range);
}

// ---- public/chat.js ----
// Lista de mensajes del chat. Cada mensaje es
// { id, role: "user" | "assistant" | "mode", content, status, error,
//   truncated, actions: [{ label, failed, undo, undone }] }.
// Los mensajes de Jarvis se pintan con Markdown; los de Emilio, como texto.


const NOTES = {
  stopped: "Detenido.",
  truncated: "Se cortó por longitud. Pídeme que continúe.",
};
const STICK_DISTANCE = 96;
// Marca de "todavía no hay texto" para no repintar el mismo estado.
const WAITING = Symbol("pensando");
// "Copiar" y "Escuchar" solo en respuestas largas: en una frase corta son ruido.
const LONG_REPLY_CHARS = 240;

function buildRow(message) {
  const row = el("li", {
    class: `msg msg--${message.role}`,
    "data-id": message.id,
  });
  if (message.role === "user")
    row.append(el("div", { class: "bubble", text: message.content }));
  else if (message.role === "mode")
    row.append(el("span", { text: `Modo ${message.content}` }));
  else
    row.append(
      el("div", { class: "md" }),
      el("p", { class: "msg-note", hidden: true }),
      el("ul", { class: "acts", hidden: true }),
      el("div", { class: "msg-tools", hidden: true }),
    );
  return row;
}

function actionItem(action, index) {
  const item = el("li", { class: action.failed ? "act act--failed" : "act" });
  item.append(
    el("span", {
      text: action.undone ? `${action.label} (restaurado)` : action.label,
    }),
  );
  if (action.undo && !action.undone)
    item.append(
      el("button", { type: "button", "data-undo": index, text: "Deshacer" }),
    );
  return item;
}

// El texto pequeño bajo una respuesta: por qué falló, se detuvo o se cortó.
function noteFor(message) {
  if (message.status === "error") return message.error;
  if (message.status === "stopped") return NOTES.stopped;
  return message.truncated ? NOTES.truncated : "";
}

function createChatView({ scroller, log }) {
  const rows = new Map();
  const painted = new Map();
  let canSpeak = false;
  let speakingId = null;

  const nearBottom = () =>
    scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight <
    STICK_DISTANCE;
  const toBottom = () => {
    scroller.scrollTop = scroller.scrollHeight;
  };

  function paintTools(row, message, isLast) {
    const tools = row.querySelector(".msg-tools");
    const settled = ["done", "stopped", "error"].includes(message.status);
    const buttons = [];
    const long = message.content.length >= LONG_REPLY_CHARS;
    const speaking = speakingId === message.id;
    if (settled && long)
      buttons.push(
        el("button", { type: "button", "data-act": "copy", text: "Copiar" }),
      );
    // Escuchar: en respuestas largas y en las que debían sonar (por si la voz
    // no arrancó sola). Mientras suena, el mismo botón la calla.
    const hearable = long || speaking || message.spoken;
    if (settled && canSpeak && hearable && message.status !== "error")
      buttons.push(
        el("button", {
          type: "button",
          "data-act": "speak",
          "aria-pressed": String(speaking),
          text: speaking ? "Detener voz" : "Escuchar",
        }),
      );
    // Con acciones ya ejecutadas no se reintenta: se repetirían.
    const failed = message.status === "error" || message.status === "stopped";
    if (isLast && failed && !message.actions?.length)
      buttons.push(
        el("button", {
          type: "button",
          "data-act": "retry",
          text: "Reintentar",
        }),
      );
    tools.replaceChildren(...buttons);
    tools.hidden = buttons.length === 0;
  }

  function paintJarvis(row, message, isLast) {
    row.dataset.status = message.status;
    const body = row.querySelector(".md");
    const shown =
      !message.content && message.status === "thinking"
        ? WAITING
        : message.content;
    // El Markdown solo se vuelve a generar si el texto cambió.
    if (painted.get(message.id) !== shown) {
      painted.set(message.id, shown);
      if (shown === WAITING)
        body.replaceChildren(el("p", { class: "thinking", text: "Pensando…" }));
      else body.innerHTML = renderMarkdown(shown);
    }
    const note = row.querySelector(".msg-note");
    const noteText = noteFor(message);
    note.textContent = noteText;
    note.hidden = !noteText;
    note.classList.toggle("msg-note--error", message.status === "error");

    const acts = row.querySelector(".acts");
    acts.replaceChildren(...(message.actions ?? []).map(actionItem));
    acts.hidden = !message.actions?.length;
    paintTools(row, message, isLast);
  }

  return {
    // Crea o actualiza un mensaje. `isLast` decide si se ofrece "Reintentar".
    upsert(message, { isLast = false, stick = false } = {}) {
      const follow = stick || nearBottom();
      let row = rows.get(message.id);
      if (!row) {
        row = buildRow(message);
        rows.set(message.id, row);
        log.append(row);
      }
      if (message.role === "assistant") paintJarvis(row, message, isLast);
      if (follow) toBottom();
    },
    remove(id) {
      rows.get(id)?.remove();
      rows.delete(id);
      painted.delete(id);
    },
    clear() {
      log.replaceChildren();
      rows.clear();
      painted.clear();
    },
    toBottom,
    setCanSpeak(value) {
      canSpeak = value;
    },
    setSpeaking(id) {
      speakingId = id;
    },
  };
}

// ---- public/panels.js ----
// Paneles de Tareas y Memoria. En pantallas anchas van fijos a la derecha; en
// el teléfono se abren como hoja sobre el chat (un panel a la vez).

const WIDE = "(min-width: 960px)";

const SYNC_NOTES = {
  loading: "Cargando…",
  late: "No alcanzo tu memoria todavía. Lo que ves puede estar desactualizado.",
  error: "Perdí la conexión con tu memoria.",
  session: "En esta vista nada se guarda al cerrar.",
};

const EMPTY = {
  tasks:
    "Sin tareas. Escribe una arriba o dile a Jarvis «anota comprar cartulina».",
  memories:
    "Jarvis todavía no recuerda nada. Dile «recuerda que…» o escríbelo arriba.",
};

function taskRow(task) {
  const box = el("input", {
    type: "checkbox",
    id: `task-${task.id}`,
    checked: task.done,
  });
  const main = el(
    "label",
    { class: "row-main" },
    box,
    el("span", { text: task.text }),
  );
  const remove = el("button", {
    type: "button",
    class: "row-del",
    "data-del": true,
    "aria-label": `Borrar tarea: ${task.text}`,
    html: icon("close"),
  });
  return el(
    "li",
    { class: task.done ? "row row--done" : "row", "data-id": task.id },
    main,
    remove,
  );
}

function memoryRow(memory) {
  const remove = el("button", {
    type: "button",
    class: "row-del",
    "data-del": true,
    "aria-label": `Borrar recuerdo: ${memory.text}`,
    html: icon("close"),
  });
  return el(
    "li",
    { class: "row", "data-id": memory.id },
    el("p", { class: "row-main", text: memory.text }),
    remove,
  );
}

function bindForm(form, input, add) {
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const value = input.value;
    if (!value.trim()) return;
    // El campo se vacía ya, para poder escribir la siguiente mientras se
    // guarda; si el guardado falla, el texto vuelve.
    input.value = "";
    input.focus();
    if (!(await add(value)) && !input.value) input.value = value;
  });
}

function bindList(list, { onToggle, onRemove }) {
  list.addEventListener("change", (event) => {
    const row = event.target.closest(".row");
    if (row && event.target.type === "checkbox")
      onToggle?.(row.dataset.id, event.target.checked);
  });
  list.addEventListener("click", (event) => {
    const row = event.target.closest("[data-del]")?.closest(".row");
    if (row) onRemove(row.dataset.id);
  });
}

// Repinta una lista y conserva el foco si estaba en uno de sus controles.
function fill(list, rows, emptyText) {
  const focusedId = list.contains(document.activeElement)
    ? document.activeElement.id
    : "";
  list.replaceChildren(
    ...(rows.length ? rows : [el("li", { class: "empty", text: emptyText })]),
  );
  if (focusedId) document.getElementById(focusedId)?.focus();
}

// Los cambios hechos a mano en los paneles. `save(change)` ejecuta el cambio
// sobre el almacén y devuelve null si falla; al borrar se ofrece deshacer.
function storeHandlers(save, toast) {
  const undo = (label, restore) =>
    toast.show(label, { action: "Deshacer", onAction: restore });
  return {
    onAddTask: async (text) =>
      Boolean(await save((store) => store.addTask(text))),
    onToggleTask: (id, done) => save((store) => store.setTaskDone(id, done)),
    async onRemoveTask(id) {
      const task = await save((store) => store.removeTask(id));
      if (task)
        undo("Tarea borrada", () => save((store) => store.restoreTask(task)));
    },
    onAddMemory: async (text) =>
      Boolean(await save((store) => store.addMemory(text))),
    async onRemoveMemory(id) {
      const memory = await save((store) => store.removeMemory(id));
      if (memory)
        undo("Recuerdo borrado", () =>
          save((store) => store.restoreMemory(memory)),
        );
    },
  };
}

// `handlers`: onAddTask(text), onToggleTask(id, done), onRemoveTask(id),
// onAddMemory(text), onRemoveMemory(id), onRetry(). Los "add" resuelven true
// si se guardó, para limpiar el campo.
function createPanels(handlers) {
  const app = $("#app");
  const shell = $("#shell");
  const side = $("#side");
  const wide = globalThis.matchMedia(WIDE);
  let opener = null;

  function showPane(name) {
    app.dataset.panel = name;
    for (const tab of side.querySelectorAll("[data-pane]"))
      tab.setAttribute("aria-pressed", String(tab.dataset.pane === name));
  }

  function close() {
    if (!app.dataset.panel) return;
    app.dataset.panel = "";
    shell.inert = false;
    opener?.focus();
    opener = null;
  }

  function open(name, trigger) {
    if (wide.matches) return;
    opener = trigger ?? document.activeElement;
    showPane(name);
    shell.inert = true;
    $("#closeSide").focus();
  }

  // En ancho el panel es una columna más; en teléfono, un diálogo.
  function fitLayout() {
    if (wide.matches) {
      app.dataset.panel = "";
      shell.inert = false;
      side.removeAttribute("role");
      side.removeAttribute("aria-modal");
    } else {
      side.setAttribute("role", "dialog");
      side.setAttribute("aria-modal", "true");
    }
  }

  bindForm($("#taskForm"), $("#taskInput"), handlers.onAddTask);
  bindForm($("#memoryForm"), $("#memoryInput"), handlers.onAddMemory);
  bindList($("#taskList"), {
    onToggle: handlers.onToggleTask,
    onRemove: handlers.onRemoveTask,
  });
  bindList($("#memoryList"), { onRemove: handlers.onRemoveMemory });
  $("#closeSide").addEventListener("click", close);
  $("#syncRetry").addEventListener("click", () => handlers.onRetry());
  for (const tab of side.querySelectorAll("[data-pane]"))
    tab.addEventListener("click", () => showPane(tab.dataset.pane));
  document.addEventListener("keydown", (event) => {
    if (event.key !== "Escape" || !app.dataset.panel) return;
    // Sin esto, el mismo Escape también cortaría una lectura en voz alta.
    event.preventDefault();
    close();
  });
  wide.addEventListener("change", fitLayout);
  fitLayout();

  return {
    open,
    close,
    // `store` es null mientras la vista todavía no responde.
    render(store) {
      const tasks = store?.tasks ?? [];
      const memories = store?.memories ?? [];
      const pending = tasks.filter((task) => !task.done).length;
      const done = tasks.length - pending;
      $("#taskTotal").textContent = [
        pending && `${pending} ${pending === 1 ? "pendiente" : "pendientes"}`,
        done && `${done} ${done === 1 ? "hecha" : "hechas"}`,
      ]
        .filter(Boolean)
        .join(" · ");
      $("#memoryTotal").textContent = memories.length
        ? `${memories.length} ${memories.length === 1 ? "recuerdo" : "recuerdos"}`
        : "";
      const waiting =
        !store ||
        (store.sync === "loading" && !tasks.length && !memories.length);
      fill(
        $("#taskList"),
        tasks.map(taskRow),
        waiting ? SYNC_NOTES.loading : EMPTY.tasks,
      );
      fill(
        $("#memoryList"),
        memories.map(memoryRow),
        waiting ? SYNC_NOTES.loading : EMPTY.memories,
      );
      const key = !store ? "" : !store.persistent ? "session" : store.sync;
      const note = SYNC_NOTES[key] && key !== "loading" ? SYNC_NOTES[key] : "";
      $("#syncNote").hidden = !note;
      $("#syncText").textContent = note;
      $("#syncRetry").hidden = key !== "error";
    },
  };
}

// ---- public/session.js ----
// La conversación en curso se guarda solo en este dispositivo. Es una
// comodidad: el almacenamiento puede faltar (ventana privada, datos
// bloqueados) y la página funciona igual. Tareas y memoria viven en `db`.

const CHAT_KEY = "jarvis:chat:v1";
const KEEP_MESSAGES = 60;
const ROLES = ["user", "assistant", "mode"];

// Devuelve { mode, messages } con lo guardado (validado campo por campo), o
// null si no hay nada que recuperar.
function readChat() {
  try {
    const saved = JSON.parse(localStorage.getItem(CHAT_KEY) ?? "null");
    if (!Array.isArray(saved?.messages)) return null;
    const messages = [];
    for (const item of saved.messages) {
      if (!ROLES.includes(item?.role)) continue;
      if (typeof item.content !== "string" || !item.content) continue;
      messages.push({
        role: item.role,
        content: item.content,
        status: item.status === "stopped" ? "stopped" : "done",
        truncated: item.truncated === true,
        actions: Array.isArray(item.actions)
          ? item.actions.filter((action) => typeof action?.label === "string")
          : [],
      });
    }
    return {
      mode: MODE_IDS.includes(saved.mode) ? saved.mode : null,
      messages,
    };
  } catch {
    return null;
  }
}

// Guarda los últimos mensajes terminados; los que fallaron no se conservan.
function writeChat(mode, messages) {
  try {
    const kept = messages
      .filter(
        (message) => message.role !== "assistant" || message.status !== "error",
      )
      .filter((message) => message.content)
      .slice(-KEEP_MESSAGES)
      .map(({ role, content, status, truncated, actions }) => ({
        role,
        content,
        status,
        truncated,
        actions,
      }));
    localStorage.setItem(CHAT_KEY, JSON.stringify({ mode, messages: kept }));
  } catch {
    // Si no se puede guardar, la conversación sigue en pantalla.
  }
}

// ---- public/status.js ----
// Textos que dependen de lo que Jarvis esté haciendo. Funciones puras:
// reciben el estado y devuelven qué mostrar.

// La línea bajo el nombre, en el encabezado.
function statusText({ phase, listening, speakingId, backend }) {
  if (phase === "thinking") return "pensando…";
  if (phase === "streaming") return "respondiendo…";
  if (speakingId) return "hablando…";
  if (listening) return "escuchando…";
  if (!backend) return "conectando…";
  return backend.mode === "cloud" ? "en línea" : "modo demo";
}

// El aviso sobre lo que esta vista no puede hacer, o null si todo funciona.
// `action` es el texto del botón cuando el aviso ofrece una salida.
function noticeFor({ backend, store }) {
  if (store?.sync === "error")
    return { text: "Perdí la conexión con tu memoria.", action: "Reintentar" };
  const demo = backend?.mode === "demo";
  const session = Boolean(store) && !store.persistent;
  if (demo && session)
    return {
      text: "Modo demo y sin memoria: respuestas fijas y nada se guarda al cerrar.",
    };
  if (demo)
    return {
      text: "Modo demo: respuestas fijas. Ábreme desde Claude para usar la IA.",
    };
  if (session)
    return {
      text: "Sin memoria en esta vista: tareas y recuerdos se pierden al cerrar.",
    };
  return null;
}

function greeting(now = new Date()) {
  const hour = now.getHours();
  let part = "Buenas noches";
  if (hour >= 5 && hour < 12) part = "Buenos días";
  else if (hour >= 12 && hour < 19) part = "Buenas tardes";
  return `${part}, ${USER_NAME}`;
}

const plural = (count, one, many) => `${count} ${count === 1 ? one : many}`;

// Resumen bajo el saludo: cuántas tareas quedan y cuántos recuerdos hay.
function telemetry(store) {
  if (!store) return "Conectando con tu memoria…";
  const pending = store.tasks.filter((task) => !task.done).length;
  const memories = store.memories.length;
  const tasks = pending
    ? plural(pending, "pendiente", "pendientes")
    : "Sin pendientes";
  const kept = memories
    ? plural(memories, "recuerdo", "recuerdos")
    : "sin recuerdos";
  return `${tasks} · ${kept}`;
}

// ---- public/talk.js ----
// Hablarle a Jarvis sin escribir: una conversación que se queda abierta turno
// tras turno. Según lo que ofrezca la vista hay dos caminos:
// - "platform": el micrófono de la capability `dictation` (Chrome y la app de
//   escritorio). Un toque lo abre y sigue escuchando hasta una hora.
// - "keyboard": en iPhone y iPad la página no puede abrir el micrófono; abre
//   el teclado para usar su dictado y no lo cierra entre turnos.
// En los dos, cada mensaje se envía solo al hacer una pausa. Mientras Jarvis
// piensa o habla la página se hace la sorda, para no oírse a sí misma.

const PAUSE_PLATFORM_MS = 1600;
const PAUSE_KEYBOARD_MS = 2200;
const KEEP_SENT = 6;
const HINTS = {
  platform: "Te escucho. Habla y envío solo cuando hagas una pausa.",
  keyboard:
    "Toca el micrófono de tu teclado y habla. Envío solo cuando hagas una pausa.",
};

// Une lo dictado con lo que ya había, sin duplicar ni comerse espacios.
function glue(base, piece) {
  if (!base) return piece.trimStart();
  if (!piece) return base;
  return /\s$/.test(base) || /^\s/.test(piece)
    ? base + piece
    : `${base} ${piece}`;
}

// Palabras sin mayúsculas ni signos, para comparar lo oído con lo enviado.
const bare = (text) =>
  text
    .toLowerCase()
    .replace(/[^\p{L}\p{N}\s]/gu, "")
    .split(/\s+/)
    .filter(Boolean);

// El dictado del teclado de iOS a veces vuelve a escribir todo lo dicho en la
// sesión. Quita del principio lo que ya se envió (`sent`, de viejo a nuevo),
// pero solo si después viene algo nuevo: repetir una frase tal cual ("sí",
// "otra vez") es un mensaje legítimo y se envía.
function withoutSent(text, sent) {
  const tokens = text.trim().split(/\s+/).filter(Boolean);
  const plain = tokens.map((token) => bare(token).join(""));
  for (let from = 0; from < sent.length; from++) {
    const prefix = bare(sent.slice(from).join(" "));
    const repeats =
      prefix.length > 0 &&
      prefix.length < plain.length &&
      prefix.every((word, i) => plain[i] === word);
    if (repeats) return tokens.slice(prefix.length).join(" ");
  }
  return tokens.join(" ");
}

// La pausa antes de enviar. El anillo del botón de enviar muestra cuánto
// falta; `onDone` se llama cuando se cumple.
function createPause(sendButton, onDone) {
  let timer = null;
  function disarm() {
    clearTimeout(timer);
    timer = null;
    sendButton.classList.remove("is-arming");
  }
  function arm(ms) {
    disarm();
    sendButton.style.setProperty("--arm", `${ms}ms`);
    // Leer el ancho obliga a reiniciar la animación del anillo.
    if (sendButton.offsetWidth >= 0) sendButton.classList.add("is-arming");
    timer = setTimeout(onDone, ms);
  }
  return { arm, disarm };
}

// `ui` trae los elementos (input, micButton, sendButton, hint, hintText) y
// tres avisos: `onText()`: la página cambió el texto de la caja.
// `onSpoken(text)`: hay un mensaje dictado listo para enviar. `onChange()`:
// la conversación se abrió o se cerró.
function createTalk(ui) {
  const { input, micButton, sendButton, hint, hintText } = ui;
  let listen = null; // micrófono de la plataforma, si existe
  let kind = null; // "platform" | "keyboard" | null
  let canKeyboard = false;
  let active = false; // la conversación está abierta
  let deaf = false; // Jarvis piensa o habla: lo que se oiga no cuenta
  let base = ""; // lo ya dictado y confirmado de este turno
  let sent = []; // lo ya enviado en esta conversación
  const { arm, disarm } = createPause(sendButton, () => deliver());

  function show(text) {
    input.value = text;
    ui.onText();
  }

  function setActive(on) {
    if (!on) disarm();
    if (active === on) return;
    active = on;
    micButton.setAttribute("aria-pressed", String(on));
    hint.hidden = !on;
    if (on) hintText.textContent = HINTS[kind];
    ui.onChange();
  }

  // Terminó la pausa: se envía lo dictado y la conversación sigue abierta.
  function deliver() {
    disarm();
    const heard =
      kind === "keyboard" ? withoutSent(input.value, sent) : input.value.trim();
    base = "";
    if (!heard) return show("");
    sent = [...sent, heard].slice(-KEEP_SENT);
    ui.onSpoken(heard);
  }

  // `platformListen`: el micrófono de voice.js o null. `touch`: hay teclado
  // en pantalla con tecla de dictado.
  function setKind(platformListen, touch = canKeyboard) {
    listen = platformListen;
    canKeyboard = touch;
    kind = listen ? "platform" : canKeyboard ? "keyboard" : null;
    micButton.hidden = !kind;
  }

  function stop() {
    if (!active) return;
    if (kind === "platform") listen.stop();
    else input.blur();
    setActive(false);
  }

  return {
    get active() {
      return active;
    },
    attach: setKind,
    // Clic en el micrófono: abre o cierra la conversación. Debe llamarse
    // directo desde el toque.
    toggle() {
      if (kind === "platform") return listen.toggle();
      if (kind !== "keyboard") return;
      if (active) return stop();
      base = "";
      sent = [];
      setActive(true);
      input.focus();
    },
    stop,
    // La página avisa cuando Jarvis empieza y cuando termina de pensar o hablar.
    setDeaf(value) {
      if (deaf === value) return;
      deaf = value;
      if (!active) return;
      disarm();
      base = "";
      // Lo que el dictado del teclado haya oído mientras Jarvis hablaba se tira.
      if (!deaf && kind === "keyboard") show("");
    },
    // La caja cambió por el usuario o por el dictado del teclado.
    onInput() {
      if (active && kind === "keyboard" && deaf) return show("");
      base = input.value;
      if (!active || kind !== "keyboard") return;
      if (withoutSent(input.value, sent)) arm(PAUSE_KEYBOARD_MS);
      else disarm();
    },
    // Eventos del micrófono de la plataforma (los entrega voice.js).
    events: {
      onDictationState(dictationState) {
        const on = dictationState !== "idle";
        if (on && !active) base = input.value;
        setActive(on);
      },
      onPartial(text) {
        if (deaf) return;
        show(glue(base, text));
        if (text) disarm();
      },
      onFinal(text) {
        if (deaf) return;
        base = glue(base, text);
        show(base);
        if (base.trim()) arm(PAUSE_PLATFORM_MS);
      },
      onDictationGone() {
        setKind(null);
        setActive(false);
      },
    },
  };
}

// ---- public/voicepanel.js ----
// Panel "Voz": elegir la voz de Jarvis, probarla, ajustar su volumen y decidir
// si contesta hablando. Las voces son las del dispositivo, ordenadas como en
// el copiloto de Born to Rally (ver voice.js).

const VOICE_NOTES = {
  ready:
    "Son las voces de tu dispositivo: ♂ es voz de hombre y ★ de alta calidad. Para tener más, en el iPhone: Ajustes, Accesibilidad, Contenido leído, Voces.",
  loading:
    "Tu dispositivo todavía no muestra voces en español. Toca «Probar» para despertarlas.",
  none: "Este navegador no tiene voz: Jarvis contesta solo con texto.",
};

// `speech` es la voz de voice.js, o null si el navegador no tiene.
function bindVoicePanel(speech) {
  const select = $("#voiceSelect");
  const volume = $("#voiceVolume");
  const spoken = $("#voiceOn");
  const note = $("#voiceNote");
  if (!speech) {
    for (const control of [select, volume, spoken, $("#voiceTest")])
      control.disabled = true;
    note.textContent = VOICE_NOTES.none;
    return;
  }

  function fill() {
    const voices = speech.voices();
    const best = voices[0] ? `Automática (${voices[0].label})` : "Automática";
    select.replaceChildren(
      el("option", { value: "", text: best }),
      ...voices.map((voice) =>
        el("option", { value: voice.name, text: voice.label }),
      ),
    );
    const chosen = speech.settings.name;
    select.value = voices.some((voice) => voice.name === chosen) ? chosen : "";
    note.textContent = voices.length ? VOICE_NOTES.ready : VOICE_NOTES.loading;
  }

  fill();
  speech.onVoices(fill);
  volume.value = String(Math.round(speech.settings.volume * 100));
  spoken.checked = !speech.settings.muted;

  // Cada cambio se oye al momento, como en las opciones del juego.
  select.addEventListener("change", () => {
    speech.setVoice(select.value);
    speech.test();
  });
  volume.addEventListener("change", () => {
    speech.setVolume(Number(volume.value) / 100);
    speech.test();
  });
  spoken.addEventListener("change", () => {
    speech.setMuted(!spoken.checked);
    if (!spoken.checked) speech.stop();
  });
  $("#voiceTest").addEventListener("click", () => {
    fill();
    speech.test();
  });
}

// ---- public/app.js ----
// Jarvis, el asistente personal de Emilio. Este archivo une las piezas: estado
// de la conversación, envío de mensajes, modos, voz y paneles.












const INPUT_MAX_HEIGHT = 132;
// Tras callar, Jarvis espera un instante antes de volver a escuchar: así no
// toma como mensaje el final de su propia voz.
const ECHO_GRACE_MS = 700;
// Frases que cierran la conversación por voz sin pasar por la IA.
const REST_WORDS =
  /^(?:jarvis[,.]?\s+)?(?:descansa|eso es todo|adi[oó]s|hasta luego|ap[aá]gate)(?:[,.]?\s+jarvis)?[.!]*$/i;

const state = {
  mode: "general",
  messages: [],
  phase: "idle", // "idle" | "thinking" | "streaming"
  controller: null,
  backend: null, // llegan cuando la vista responde (ver boot)
  store: null,
  voice: { listen: null, speech: null }, // ver voice.js
  spoken: false, // el último mensaje se dictó: Jarvis contesta hablando
  speakingId: null,
  dismissedNotice: "",
  nextId: 1,
};
const ready = { backend: null, store: null };

const app = $("#app");
const input = $("#input");
const sendButton = $("#send");
const micButton = $("#mic");
const core = createCore(app);
const toast = createToast($("#toast"));
const chat = createChatView({ scroller: $("#main"), log: $("#log") });
const coarsePointer = globalThis.matchMedia("(pointer: coarse)");
// Modo voz: dictar el mensaje y que se envíe solo tras una pausa (talk.js).
// Conversación por voz: dictar y que cada mensaje se envíe solo (talk.js).
const talk = createTalk({
  input,
  micButton,
  sendButton,
  hint: $("#voiceHint"),
  hintText: $("#voiceHintText"),
  onText() {
    fitInput();
    renderSend();
  },
  onSpoken: heard,
  onChange: () => setPhase(state.phase),
});
let echoTimer = null;

// ---------- Conversación guardada (ver session.js) ----------

function loadChat() {
  const saved = readChat();
  if (!saved) return;
  if (saved.mode) state.mode = saved.mode;
  for (const message of saved.messages)
    state.messages.push({ id: state.nextId++, ...message });
}

const saveChat = () => writeChat(state.mode, state.messages);

// ---------- Mensajes ----------

const isLast = (message) => message === state.messages.at(-1);
const repaint = (message) => chat.upsert(message, { isLast: isLast(message) });

function repaintAll() {
  for (const message of state.messages)
    if (message.role === "assistant") repaint(message);
}

function pushMessage(fields) {
  const message = { id: state.nextId++, actions: [], ...fields };
  const previous = state.messages.at(-1);
  state.messages.push(message);
  if (previous) repaint(previous); // deja de ser el último: ya no ofrece Reintentar
  chat.upsert(message, { isLast: true, stick: true });
  return message;
}

function dropMessage(message) {
  state.messages = state.messages.filter((item) => item !== message);
  chat.remove(message.id);
  const last = state.messages.at(-1);
  if (last) repaint(last);
}

function historyTurns(before) {
  const turns = [];
  for (const message of state.messages) {
    if (message === before) break;
    if (message.role !== "mode" && message.content)
      turns.push({ role: message.role, content: message.content });
  }
  return turns;
}

// ---------- Estado visible ----------

function syncCore() {
  const speaking = state.phase === "streaming" || Boolean(state.speakingId);
  if (state.phase === "thinking") core.set("thinking");
  else if (speaking) core.set("speaking");
  else core.set(talk.active ? "listening" : "idle");
  core.talk(state.phase === "idle" && Boolean(state.speakingId));
}

// El botón naranja envía; mientras Jarvis contesta o habla, lo detiene.
function renderSend() {
  const busy = state.phase !== "idle";
  const talking = !busy && Boolean(state.speakingId) && !input.value.trim();
  sendButton.innerHTML = icon(busy || talking ? "stop" : "send");
  let label = "Enviar mensaje";
  if (busy) label = "Detener respuesta";
  else if (talking) label = "Detener voz";
  sendButton.setAttribute("aria-label", label);
  sendButton.classList.toggle(
    "is-empty",
    !busy && !talking && !input.value.trim(),
  );
}

// Mientras Jarvis piensa o habla, el modo voz no escucha (se oiría a sí mismo).
function syncTalk() {
  clearTimeout(echoTimer);
  if (state.phase !== "idle" || state.speakingId) talk.setDeaf(true);
  else echoTimer = setTimeout(() => talk.setDeaf(false), ECHO_GRACE_MS);
}

function setPhase(phase) {
  state.phase = phase;
  renderSend();
  syncCore();
  syncTalk();
  $("#status").textContent = statusText({ ...state, listening: talk.active });
}

function renderNotice() {
  const notice = noticeFor(state);
  const show = notice && notice.text !== state.dismissedNotice;
  $("#notice").hidden = !show;
  if (!show) return;
  $("#noticeText").textContent = notice.text;
  $("#noticeButton").textContent = notice.action ?? "Entendido";
}

function renderStore() {
  panels.render(state.store);
  $("#greeting").textContent = greeting();
  $("#telemetry").textContent = telemetry(state.store);
  const pending = state.store?.tasks.filter((task) => !task.done).length ?? 0;
  $("#taskCount").textContent = String(pending);
  $("#taskCount").hidden = pending === 0;
  $("#openTasks").setAttribute(
    "aria-label",
    pending ? `Tareas, ${pending} pendientes` : "Tareas",
  );
  renderNotice();
}

function renderMode() {
  const mode = MODES[state.mode];
  for (const button of $("#modes").querySelectorAll("button"))
    button.setAttribute(
      "aria-pressed",
      String(button.dataset.mode === state.mode),
    );
  input.placeholder = mode.placeholder;
  const chips = mode.suggestions.map((suggestion) => {
    const chip = el("button", {
      type: "button",
      class: "chip",
      text: suggestion.label,
    });
    chip.addEventListener("click", () => {
      if (!suggestion.fill) return send(suggestion.text);
      input.value = suggestion.text;
      fitInput();
      renderSend();
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    });
    return chip;
  });
  $("#chips").replaceChildren(...chips);
}

function setMode(mode) {
  if (mode === state.mode || !MODES[mode]) return;
  state.mode = mode;
  // Un cambio de modo deja una marca en la conversación; dos seguidos, una sola.
  const last = state.messages.at(-1);
  if (last?.role === "mode") dropMessage(last);
  if (state.messages.length)
    pushMessage({ role: "mode", content: MODES[mode].name });
  renderMode();
  saveChat();
}

// ---------- Vista: pantalla vacía o conversación ----------

function enterChat(animate) {
  if (app.dataset.view === "chat") return;
  const hero = $("#hero");
  const box = hero.getBoundingClientRect();
  app.dataset.view = "chat";
  $("#newChat").hidden = false;
  if (!animate) return core.refresh();
  // El núcleo grande vuela a su sitio en el encabezado. El inicio se queda
  // clavado donde estaba mientras dura el vuelo.
  for (const side of ["left", "top", "width", "height"])
    hero.style[side] = `${box[side]}px`;
  app.classList.add("is-docking");
  dockCore($("#heroCore .core"), $("#miniCore .core")).then(() => {
    app.classList.remove("is-docking");
    hero.removeAttribute("style");
    core.refresh();
  });
}

function leaveChat() {
  app.dataset.view = "empty";
  $("#newChat").hidden = true;
  core.refresh();
}

function newChat() {
  if (state.phase !== "idle" || state.messages.length === 0) return;
  const old = state.messages;
  talk.stop();
  state.voice.speech?.stop();
  state.messages = [];
  chat.clear();
  leaveChat();
  saveChat();
  toast.show("Conversación borrada", {
    action: "Deshacer",
    onAction() {
      if (state.messages.length) return;
      state.messages = old;
      for (const message of old)
        chat.upsert(message, { isLast: isLast(message) });
      enterChat(false);
      chat.toBottom();
      saveChat();
    },
  });
}

// ---------- Enviar y recibir ----------

function settleFailure(reply, error) {
  if (error?.cancelled) {
    const kept =
      typeof error.partial === "string" ? error.partial : reply.content;
    if (!kept && reply.actions.length === 0) return dropMessage(reply);
    reply.content = kept;
    reply.status = "stopped";
    return;
  }
  const known = error instanceof AskError || error instanceof StoreError;
  if (!known) console.error(error);
  // Sin `partial` (p. ej. "refused") el texto mostrado se retira.
  reply.content = typeof error?.partial === "string" ? error.partial : "";
  reply.status = "error";
  reply.error = known ? error.message : "Algo falló. Vuelve a intentarlo.";
}

async function runTurn() {
  const reply = pushMessage({
    role: "assistant",
    content: "",
    status: "thinking",
  });
  const controller = new AbortController();
  state.controller = controller;
  setPhase("thinking");
  // Si el mensaje se dictó, la respuesta se lee en voz alta según va llegando.
  const voice = state.voice.speech;
  const speech = state.spoken && !voice?.settings.muted ? voice : null;
  reply.spoken = Boolean(speech);
  speech?.begin(reply.id);
  let shown = 0;
  try {
    const store = await ready.store;
    await ready.backend;
    const result = await state.backend.ask({
      mode: state.mode,
      turns: historyTurns(reply),
      tasks: store.tasks,
      memories: store.memories,
      persistent: store.persistent,
      spoken: Boolean(speech),
      actions: store,
      signal: controller.signal,
      onText(text) {
        if (state.phase !== "streaming") setPhase("streaming");
        core.kick(Math.max(0, text.length - shown));
        shown = text.length;
        reply.content = text;
        reply.status = "streaming";
        repaint(reply);
        speech?.feed(reply.id, text, false);
      },
      onAction(action) {
        reply.actions.push(action);
        repaint(reply);
      },
    });
    reply.content = result.text;
    reply.truncated = result.truncated;
    reply.status = "done";
    speech?.feed(reply.id, reply.content, true);
  } catch (error) {
    speech?.stop();
    settleFailure(reply, error);
  } finally {
    state.controller = null;
    setPhase("idle");
    if (state.messages.includes(reply)) repaint(reply);
    saveChat();
  }
}

// `spoken`: el mensaje llegó por voz, así que Jarvis también contesta hablando.
function send(raw, { spoken = false } = {}) {
  const text = raw.trim();
  if (!text || state.phase !== "idle") return;
  state.spoken = spoken || talk.active;
  state.voice.speech?.stop();
  pushMessage({ role: "user", content: text });
  enterChat(true);
  input.value = "";
  fitInput();
  runTurn();
}

function retry(message) {
  if (state.phase !== "idle" || !isLast(message)) return;
  dropMessage(message);
  if (state.messages.at(-1)?.role === "user") runTurn();
}

async function undoAction(message, index) {
  const action = message.actions[index];
  if (!action?.undo || action.undone) return;
  try {
    const store = await ready.store;
    if (action.undo.kind === "task") await store.restoreTask(action.undo.item);
    else await store.restoreMemory(action.undo.item);
    action.undone = true;
    repaint(message);
    saveChat();
  } catch (error) {
    toast.show(
      error instanceof StoreError ? error.message : "No se pudo deshacer.",
    );
  }
}

// ---------- Tareas y memoria desde los paneles ----------

// Ejecuta un cambio y muestra el motivo si falla. Devuelve null en ese caso.
async function saving(change) {
  try {
    return await change(await ready.store);
  } catch (error) {
    toast.show(
      error instanceof StoreError ? error.message : "No se pudo guardar.",
    );
    return null;
  }
}

const panels = createPanels({
  ...storeHandlers(saving, toast),
  onRetry: () => state.store?.retry(),
});

// ---------- Caja de texto ----------

function fitInput() {
  input.style.height = "auto";
  input.style.height = `${Math.min(input.scrollHeight, INPUT_MAX_HEIGHT)}px`;
}

// Llegó un mensaje dictado. "Descansa" y parecidas cierran la conversación.
function heard(text) {
  if (!REST_WORDS.test(text.trim())) return send(text, { spoken: true });
  talk.stop();
  input.value = "";
  fitInput();
  renderSend();
  const voice = state.voice.speech;
  if (voice && !voice.settings.muted) voice.say("Aquí estaré.");
}

const voiceHandlers = {
  onNotice: (text) => toast.show(text),
  ...talk.events,
  // "starting" cuenta como hablando: la voz ya está en camino.
  onSpeechState(speechState, id) {
    state.speakingId = speechState === "idle" ? null : id;
    chat.setSpeaking(state.speakingId);
    repaintAll();
    setPhase(state.phase);
  },
};

// ---------- Eventos ----------

async function copyFrom(button, text, source) {
  if (await copyText(text)) {
    const label = button.textContent;
    button.textContent = "Copiado";
    setTimeout(() => {
      button.textContent = label;
    }, 1400);
    return;
  }
  selectContents(source);
  toast.show(
    "No pude copiar solo. El texto quedó seleccionado para que lo copies.",
  );
}

function onLogClick(event) {
  const button = event.target.closest("button");
  if (!button) return;
  const row = button.closest(".msg");
  if (button.hasAttribute("data-copy")) {
    const code = button.closest(".code")?.querySelector("code");
    if (code) copyFrom(button, code.textContent, code);
    return;
  }
  const message = state.messages.find(
    (item) => String(item.id) === row?.dataset.id,
  );
  if (!message) return;
  if (button.dataset.undo !== undefined)
    undoAction(message, Number(button.dataset.undo));
  else if (button.dataset.act === "copy")
    copyFrom(button, message.content, row.querySelector(".md"));
  // La voz exige que la llamada salga directo del clic.
  else if (button.dataset.act === "speak")
    state.voice.speech?.toggle(message.id, message.content);
  else if (button.dataset.act === "retry") retry(message);
}

function bindEvents() {
  $("#composer").addEventListener("submit", (event) => {
    event.preventDefault();
    if (state.phase !== "idle") state.controller?.abort();
    else if (state.speakingId && !input.value.trim())
      state.voice.speech?.stop();
    else send(input.value);
  });
  input.addEventListener("input", () => {
    fitInput();
    renderSend();
    talk.onInput();
  });
  // En teclado físico Enter envía; en pantalla táctil hace salto de línea.
  input.addEventListener("keydown", (event) => {
    if (event.key !== "Enter" || event.shiftKey || event.isComposing) return;
    if (coarsePointer.matches) return;
    event.preventDefault();
    send(input.value);
  });
  // El toque en el micrófono también desbloquea la voz: Safari solo deja que
  // Jarvis hable si antes hubo un toque.
  micButton.addEventListener("click", () => {
    state.voice.speech?.unlock();
    state.voice.speech?.stop();
    talk.toggle();
  });
  // Que el botón no le quite el foco a la caja (cerraría el teclado).
  micButton.addEventListener("mousedown", (event) => event.preventDefault());
  $("#modes").addEventListener("click", (event) => {
    const mode = event.target.closest("button")?.dataset.mode;
    if (mode) setMode(mode);
  });
  $("#openTasks").addEventListener("click", (event) =>
    panels.open("tasks", event.currentTarget),
  );
  $("#openMemory").addEventListener("click", (event) =>
    panels.open("memory", event.currentTarget),
  );
  $("#voiceSettings").addEventListener("click", (event) =>
    panels.open("voice", event.currentTarget),
  );
  $("#newChat").addEventListener("click", newChat);
  $("#log").addEventListener("click", onLogClick);
  $("#noticeButton").addEventListener("click", () => {
    const notice = noticeFor(state);
    if (notice?.action) return state.store?.retry();
    state.dismissedNotice = notice?.text ?? "";
    renderNotice();
  });
}

// ---------- Arranque ----------

function boot() {
  $("#heroCore").innerHTML = coreMarkup("hero");
  $("#miniCore").innerHTML = coreMarkup("mini");
  $("#openTasks").insertAdjacentHTML("afterbegin", icon("tasks"));
  $("#openMemory").insertAdjacentHTML("afterbegin", icon("memory"));
  $("#newChat").innerHTML = icon("plus");
  $("#closeSide").innerHTML = icon("close");
  micButton.innerHTML = icon("mic");
  $("#modes").replaceChildren(
    ...MODE_IDS.map((id) =>
      el("button", {
        type: "button",
        class: "mode",
        "data-mode": id,
        text: MODES[id].name,
      }),
    ),
  );

  loadChat();
  bindEvents();
  renderMode();
  renderStore();
  setPhase("idle");
  if (state.messages.length) {
    for (const message of state.messages)
      chat.upsert(message, { isLast: isLast(message) });
    enterChat(false);
    chat.toBottom();
  }

  // La página se pinta ya; cada capability se enciende cuando la vista responde.
  ready.backend = createBackend({
    onGone(demo) {
      state.backend = demo;
      setPhase(state.phase);
      renderNotice();
    },
  }).then((backend) => {
    state.backend = backend;
    setPhase(state.phase);
    renderNotice();
    return backend;
  });
  ready.store = createStore(renderStore).then((store) => {
    state.store = store;
    renderStore();
    return store;
  });
  createVoice(voiceHandlers).then((voice) => {
    state.voice = voice;
    talk.attach(voice.listen, coarsePointer.matches);
    bindVoicePanel(voice.speech);
    chat.setCanSpeak(Boolean(voice.speech));
    repaintAll();
  });
}

boot();

</script>
