<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB089"/>
      <stop offset="0.5" stop-color="#F04E23"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <mask id="cut">
      <rect width="64" height="64" fill="#fff"/>
      <rect x="32" y="22.4" width="22" height="5.6" fill="#000"/>
      <rect x="32" y="36" width="22" height="5.6" fill="#000"/>
      <rect x="47.5" y="27.5" width="8" height="9" fill="#000"/>
    </mask>
  </defs>
  <!-- ERA Studio: el sol que sale es una E (concepto "Nueva Era") -->
  <rect width="64" height="64" rx="14" fill="#14183A"/>
  <circle cx="32" cy="32" r="22" fill="url(#sun)" mask="url(#cut)"/>
</svg>
