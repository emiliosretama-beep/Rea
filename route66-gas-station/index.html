<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c1626">
<title>Route 66 Gas Station</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="touch-layer"></div>

<!-- HUD del juego -->
<div id="hud">
  <div id="crosshair"></div>
  <div id="prompt"><kbd class="pc-only">E</kbd><span id="prompt-text"></span></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="look-hint" class="pc-only" data-i18n="clickToLook"></div>
  <div id="fps" hidden></div>
  <button id="btn-pause" type="button" data-i18n-aria="pause">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  </button>
</div>

<!-- Controles táctiles -->
<div id="joy"><div id="joy-knob"></div></div>
<button id="btn-interact" type="button" data-i18n-aria="interact">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0-1.5a1.5 1.5 0 0 1 3 0V11m0-1a1.5 1.5 0 0 1 3 0v4.5c0 3.6-2.4 6-6 6h-.8c-1.9 0-3.2-.7-4.3-2.2L4.6 14a1.5 1.5 0 0 1 2.4-1.8L9 14.5"/></svg>
</button>

<!-- Pantalla de inicio / pausa -->
<div id="menu">
  <button id="btn-lang" type="button" data-i18n-aria="language">EN</button>
  <div class="menu-card">
    <div class="badge" aria-hidden="true"><span>ROUTE</span><b>66</b></div>
    <h1>Route 66<br>Gas Station</h1>
    <p class="tagline" data-i18n="tagline"></p>
    <button id="btn-play" type="button" data-i18n="play"></button>
    <p class="help pc-only" data-i18n="helpPc"></p>
    <p class="help touch-only" data-i18n="helpTouch"></p>
  </div>
  <div id="version"></div>
</div>

<!-- Aviso de orientación (solo táctil en vertical) -->
<div id="rotate">
  <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="16" y="6" width="16" height="30" rx="3"/><path d="M8 34a16 16 0 0 0 14 9M22 43l-4-1 2-4"/></svg>
  <p data-i18n="rotate"></p>
  <button id="btn-rotate-skip" type="button" data-i18n="rotateSkip"></button>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
