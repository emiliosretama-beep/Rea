<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ERA Factory</title>
    <meta name="description" content="Fábrica de canales de YouTube: agentes de IA que investigan, escriben y producen videos bajo tu supervisión." />
    <meta name="theme-color" content="#0a0f1e" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="side" aria-label="Navegación principal">
        <a class="brand" href="#centro" aria-label="ERA Factory, inicio">
          <img src="/favicon.svg" alt="" width="30" height="30" />
          <span><strong>ERA</strong> Factory</span>
        </a>
        <nav class="nav" id="nav"></nav>
        <div class="side-status" id="side-status"></div>
      </aside>
      <main class="view"><div id="notice"></div><div id="view" tabindex="-1"></div></main>
    </div>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
